# Publication de l'image sur GHCR, LS-74.
#
# POURQUOI UN WORKFLOW SEPARE DE `controles.yml`.
#
# Publier exige `packages: write`. Poser ce droit sur le workflow de controles
# le donnerait a chaque execution declenchee par une pull request, y compris
# celles qui portent du code non encore relu. Ici le droit d'ecriture ne vit que
# sur `main`, apres fusion, donc apres la revue et les huit controles.
#
# `controles.yml` construit deja l'image a chaque pull request, pas 7b : une
# image qui ne se construit pas fait rougir la PR et n'arrive jamais jusqu'ici.
# Ce workflow ne decouvre donc pas un echec de construction, il publie ce qui a
# deja ete verifie.
#
# CE QU'IL NE FAIT PAS : deployer. Le VPS appartient a la phase 6. Cette story
# prouve que l'application est deployable, elle ne la deploie pas.

name: Publier l'image

on:
  push:
    branches: [main]

  # Declenchement manuel, pour republier une image sans nouveau commit.
  workflow_dispatch:

# Une publication a la fois. Deux fusions rapprochees pousseraient deux images
# en parallele, sans consequence sur les tags par SHA, qui sont distincts, mais
# `cancel-in-progress` est volontairement absent : une publication interrompue
# a mi-chemin laisserait un tag partiel sur le registre.
concurrency:
  group: publier-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Construire et publier sur GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      # Buildx est necessaire pour le cache de construction entre executions.
      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: S'authentifier sur GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # LE TAG EST L'IDENTIFIANT DE COMMIT, ET C'EST LUI LA REFERENCE DE RETOUR
      # ARRIERE.
      #
      # `latest` est publie aussi, mais UNIQUEMENT comme commodite pour tirer la
      # derniere image. Ne jamais s'en servir pour revenir en arriere : il
      # designe toujours la derniere version, donc « revenir a latest » revient
      # a rester ou l'on est.
      #
      # Le SHA passe par `env:` et non par interpolation directe dans `run:`.
      # Ici la valeur vient de GitHub et non d'un contributeur, mais la regle
      # vaut sans exception : une interpolation dans un `run:` est une injection
      # en puissance.
      #
      # Ce workflow ne s'execute que sur `push: main`, donc `github.sha` est
      # bien le commit de `main` et non un commit de fusion de pull request.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # CONSTRUIRE, VERIFIER, PUIS PUBLIER. L'ORDRE EST LE SUJET, LS-177.
      #
      # CE QUI ETAIT FAIT AVANT, ET LE TROU QUE CELA OUVRAIT. Ce workflow
      # publiait d'abord, `push: true`, puis rejouait les controles de securite
      # sur l'image tiree du registre. Le commentaire justifiait cet ordre :
      # verifier une image construite localement ne dit rien de celle qui est
      # partie. L'argument est juste, la consequence ne l'etait pas.
      #
      # GHCR EST PUBLIC ET LE DEPOT AUSSI, invariant 9. Une image portant un
      # `.env` dans une couche etait donc PUBLIEE avant qu'aucun controle ne
      # l'attrape, et une image publiee ne se derappelle pas : elle a pu etre
      # tiree, indexee, copiee. Le controle d'apres ne pouvait que constater.
      #
      # CE TROU N'ETAIT PAS VISIBLE tant que `controles.yml` construisait l'image
      # sur chaque pull request : ce pas-la servait de barriere AVANT publication,
      # sans que ce soit son role declare. LS-177 le retire du chemin des pull
      # requests, ce qui a rendu la dependance visible.
      #
      # `load: true` CHARGE L'IMAGE DANS LE DEMON LOCAL SANS LA PUBLIER, verifie
      # sur la documentation de `build-push-action` via Context7. L'image
      # verifiee est alors LA MEME que celle qui sera publiee, meme empreinte :
      # l'objection d'origine tombe, sans qu'il faille publier pour verifier.
      #
      # LE SECOND APPEL NE RECONSTRUIT RIEN, le cache `type=gha` etant partage
      # entre les deux pas. Il pousse les couches deja construites.
      # ----------------------------------------------------------------------
      - name: Construire l'image sans la publier
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # LA BARRIERE. Elle s'execute sur l'image chargee localement, avant tout
      # envoi vers le registre : un echec ici laisse GHCR intact.
      - name: Controles de securite avant publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: ./scripts/verifier-image-docker.sh "$IMAGE"

      - name: Publier l'image verifiee
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rappeler la reference de retour arriere
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "### Image publiee" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$IMAGE"'`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "C'est cette reference, et non \`latest\`, qui sert au retour arriere." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Un retour a une image precedente ne repare pas une migration destructive :" >> "$GITHUB_STEP_SUMMARY"
          echo "le code revient, les donnees non." >> "$GITHUB_STEP_SUMMARY"
