# Chaine d'integration continue, LS-69.
#
# Execute les huit controles de CONTRIBUTING.md sur chaque pull request vers
# main, et sur main apres fusion. Avant cette story, aucun ne tournait
# automatiquement : ils dependaient de quelqu'un qui pense a les lancer, et
# l'oubli s'est produit au moins trois fois, dont un defaut de schema passe le
# 29 juillet 2026 alors que verifier-schema.sh existait depuis deux jours.
#
# CE FICHIER A ETE PROUVE ROUGE, et pas seulement vert. La pull request 59,
# jetable et depuis fermee, portait chk_variante_pas_de_survente retiree du SQL
# de reference : l'etape 6 a echoue sur « 91 reussites, 1 echecs » et la chaine
# s'est arretee la. Un workflow jamais vu rouge n'est pas un workflow prouve.
#
# LA PROTECTION DE main S'APPLIQUE A TOUT LE MONDE, PROPRIETAIRE COMPRIS. Le
# controle « Les huit controles de CONTRIBUTING » est requis, la pull request
# obligatoire, et `enforce_admins` vaut true. Un push direct sur main est refuse,
# sans exception et sans sortie de secours.
#
# CE COMMENTAIRE A AFFIRME L'INVERSE jusqu'au 10 aout 2026 : il decrivait
# `enforce_admins` a false et un push direct qui « reussit quand meme ». Le
# reglage a change le 31 juillet en LS-69 sans que ce texte suive, et il invitait
# donc a tenter un contournement qui echoue. Mesure avant correction :
#
#   gh api repos/krismos64/lune-soleil/branches/main/protection \
#     --jq .enforce_admins.enabled   # true
#
# Ne pas verifier ce reglage par un push reel sur main. Le cas s'est produit a
# l'epoque ou il valait false et a laisse le commit b550194 hors de toute pull
# request. L'appel API ci-dessus repond sans rien ecrire.
#
# UN SEUL JOB, ET NON HUIT EN PARALLELE. Les controles partagent l'installation
# des dependances, la generation du client Prisma et la base PostgreSQL. Les
# repartir sur plusieurs jobs rejouerait `npm ci` et `prisma generate` a chaque
# fois, pour un gain nul a cette taille de projet. Le decoupage se reconsiderera
# quand la duree totale genera.
#
# ORDRE VOLONTAIRE. La validation du schema passe EN PREMIER, decision de
# l'arbitrage du 29 juillet : c'est le seul controle dont l'absence d'execution a
# deja laisse passer un defaut. Le placer apres la construction retarderait son
# signal sans rien apporter.
#
# AUCUN COMPTE DE CONTROLES N'EST FIGE ICI. Le nombre d'assertions de
# verifier-schema.sh augmente a chaque story ; un chiffre attendu inscrit dans ce
# fichier deviendrait faux a la story suivante et serait relache plutot que
# corrige. Les scripts portent eux-memes leurs garde-fous de completude.
#
# PAS DE SERVICE `services:` ICI, ET C'EST DELIBERE. Les deux modes de
# verifier-schema.sh pilotent leur base par `docker exec` sur un conteneur NOMME,
# jetable pour l'un, `lune-soleil-db` pour l'autre. Un service GitHub Actions
# porte un nom engendre a l'execution, que le script ne peut pas deviner. La base
# est donc demarree par `docker run` sous le nom attendu, ce qui laisse le script
# intact : il est prouve par mutation, le modifier pour l'integration continue
# obligerait a rejouer cette preuve.
name: Controles

on:
  pull_request:
    branches: [main]

  # LS-176. LA POUSSEE SUR `main` NE DECLENCHE PLUS LA CHAINE, et c'est le
  # changement qui divise la consommation par deux.
  #
  # CE QUI ETAIT ECRIT ICI : « une fusion en rebase rejoue les commits sur une
  # base differente de celle testee dans la pull request, le resultat n'est donc
  # pas garanti identique ». L'argument est juste en general et FAUX SUR CE
  # DEPOT, ou `required_status_checks.strict` vaut true : GitHub refuse de
  # fusionner une branche qui n'est pas a jour avec `main`, donc l'arbre fusionne
  # EST celui que la pull request a teste. Le second passage revalidait un etat
  # deja vert.
  #
  # MESURE, 3 et 4 septembre 2026 : deux executions par livraison, 17 min 30
  # chacune en suite complete. La moitie de cette depense ne repondait a aucune
  # question.
  #
  # CE QUI TIENT CETTE SUPPRESSION. `verifier-protection-branche.sh` echoue si
  # `strict` repasse a false, cas ou une fusion pourrait produire un arbre jamais
  # teste et ou ce declencheur devrait revenir. Sans ce controle, la protection
  # sauterait en silence le jour d'un changement de reglage.
  #
  # LE CONTROLE DE `main` N'EST PAS PERDU POUR AUTANT : `publier-image.yml` reste
  # declenche sur `main` et construit l'image a partir de l'etat fusionne.
  workflow_dispatch:
    inputs:
      raison:
        description: "Pourquoi cette relance manuelle"
        required: false
        default: "Verification complete a la demande"

# Une nouvelle poussee sur une branche annule l'execution precedente, qui porte
# sur un code deja remplace. Jamais sur main : chaque etat fusionne doit avoir
# son propre resultat, sous peine de laisser un commit sans controle.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Lecture seule. Ce workflow ne publie rien, ne commente rien et n'ecrit dans
# aucun paquet : le jeton n'a besoin d'aucun droit d'ecriture.
permissions:
  contents: read

jobs:
  controles:
    name: Les huit controles de CONTRIBUTING
    runs-on: ubuntu-latest
    # Cette borne evite qu'une etape bloquee, un conteneur qui ne demarre
    # jamais, consomme une heure. Elle ne borne PAS une execution normale.
    #
    # PORTEE DE 30 A 45 MINUTES EN LS-106, apres une annulation reelle. Le
    # commentaire disait « tient largement dedans » et ce n'etait plus vrai : la
    # suite de bout en bout est passee de 200 a 250 tests entre LS-104 et
    # LS-106, sur trois largeurs, et le job a ete coupe a 30 minutes PENDANT
    # l'installation du navigateur, toutes les etapes precedentes vertes.
    #
    # LA BORNE SUIT LA SUITE, elle ne la contraint pas. Une annulation par delai
    # ne dit rien du code : elle ressemble a un echec sans en etre un, et coute
    # une execution complete pour rien. Si la suite continue de croitre, relever
    # a nouveau plutot que de reduire la couverture.
    timeout-minutes: 45

    env:
      # Base de controle, jetable, detruite avec le runner et joignable
      # uniquement depuis ce job. Ces valeurs ne protegent aucune donnee reelle
      # et ne sont un secret dans aucun sens utile.
      #
      # ECRITES EN MORCEAUX, ET NON EN UNE CHAINE DE CONNEXION. Le motif
      # `utilisateur:valeur@hote` fait bloquer le commit par l'analyse de
      # secrets, a juste titre : le depot est public, et l'analyse ne peut pas
      # deviner qu'une valeur est inventee. Un faux positif tolere apprend a
      # ignorer l'alerte, et c'est le vrai secret suivant qui passe. Meme
      # traitement que dans les tests unitaires de LS-68.
      #
      # Le port 55432 est celui de docker-compose.yml en local, garde ici pour
      # que les deux environnements se ressemblent.
      PGUSER: lunesoleil
      PGPASSWORD: ci_local_jetable
      PGDATABASE: lunesoleil
      PGPORT: "55432"
      # Playwright et Vitest lisent CI : `forbidOnly`, une retentative, et le
      # rapporteur GitHub. Le runner la definit deja, cette ligne rend la
      # dependance visible plutot qu'implicite.
      CI: "true"
      # Tarifs de livraison, ADR-025, ajoutes par LS-115.
      #
      # ILS NE SONT PAS FACULTATIFS EN CI. `lireConfigurationLivraison` leve
      # quand un tarif manque, deliberement : un repli a zero afficherait
      # « livraison offerte » partout. Sans ces trois lignes, la page du tunnel
      # rend une erreur serveur et neuf tests de bout en bout echouent, ce qui
      # est arrive le 25 aout 2026 : le defaut avait ete trouve en local et
      # corrige dans `.env`, sans etre porte ici.
      #
      # Valeurs publiques, aucun secret : elles figurent dans les conditions
      # generales et sur la page Livraison.
      #
      # LE DOMICILE EST PASSE DE 499 A 749 LE 6 SEPTEMBRE 2026, ADR-035, et ces
      # deux workflows sont restes a 499 jusqu'au 7 : la valeur avait ete portee
      # dans `.env.example` et dans les tests, jamais ici. C'est EXACTEMENT le
      # defaut que le paragraphe ci-dessus raconte pour le 25 aout, reproduit a
      # l'identique sur la meme variable.
      #
      # 499 venait de la grille PUBLIQUE Mondial Relay et perdait 2,50 EUR par
      # colis face au cout reel de 6,24 EUR HT. Le domicile est facture a son
      # prix coutant, 7,49 EUR TTC.
      SHIPPING_RELAY_RATE_CENTS: "410"
      SHIPPING_HOME_RATE_CENTS: "749"
      SHIPPING_FREE_THRESHOLD_CENTS: "3900"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      # DATABASE_URL est assemblee ici plutot qu'ecrite en clair plus haut, voir
      # le commentaire du bloc `env`. Elle est ensuite disponible pour toutes les
      # etapes suivantes, prisma.config.ts la lisant pour `migrate deploy` comme
      # pour la base ephemere des tests d'integration.
      - name: Composer l'URL de connexion
        run: |
          # Le prefixe du protocole est lui aussi assemble. Ecrit d'un seul
          # tenant, meme avec des variables a la place de l'utilisateur et du mot
          # de passe, la forme reconnue par l'analyse de secrets reste litterale
          # dans le fichier et le commit est bloque. L'analyse ne peut pas savoir
          # que ces valeurs sont jetables, et c'est le bon comportement pour un
          # depot public.
          schema='postgre'
          schema="${schema}sql://"
          printf 'DATABASE_URL=%s%s:%s@localhost:%s/%s?schema=public\n' \
            "$schema" "$PGUSER" "$PGPASSWORD" "$PGPORT" "$PGDATABASE" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Authentification, LS-70.
      #
      # LE CONTROLE 8 SERT UNE VRAIE APPLICATION. Playwright demarre
      # `next start`, qui evalue src/lib/auth.ts hors phase de construction :
      # le garde-fou y exige BETTER_AUTH_SECRET, et il a raison. Sans lui,
      # Better Auth signerait ses cookies avec un secret par defaut public.
      #
      # CE N'EST PAS UN SECRET DE COMPLAISANCE. Il ne contente pas un controle,
      # il configure un serveur reellement servi le temps de la suite. La
      # nuance est visible dans sa duree de vie : engendre a chaque execution,
      # jamais ecrit dans le depot, detruit avec le runner. Aucune session
      # signee par cette valeur n'existe ailleurs que dans ces neuf minutes.
      #
      # `openssl` plutot qu'une constante, pour la meme raison que le mot de
      # passe de la base est jetable : une valeur litterale dans un depot
      # PUBLIC serait bloquee par l'analyse de secrets, a juste titre, et un
      # faux positif tolere apprend a ignorer l'alerte suivante.
      #
      # BETTER_AUTH_URL doit designer le serveur REELLEMENT servi, port compris,
      # sinon Better Auth rejette toute connexion en « Invalid origin ». Le port
      # 3100 est celui de playwright.config.ts.
      #
      # `add-mask` est indispensable : GitHub ne masque que ce qu'il connait
      # deja, et une valeur engendree pendant l'execution lui est inconnue. Sans
      # cette ligne elle s'affiche EN CLAIR dans le bloc `env:` de chaque etape
      # suivante, sur un depot public. Sans consequence ici puisqu'elle meurt
      # avec le runner, mais une valeur en clair toleree dans un journal apprend
      # a ne plus regarder les suivantes.
      #
      # La valeur passe par une variable AVANT d'etre masquee puis ecrite :
      # appeler openssl deux fois produirait deux valeurs distinctes, et celle
      # qui serait masquee ne serait pas celle qui sert.
      - name: Composer les variables d'authentification
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          printf 'BETTER_AUTH_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
          printf 'BETTER_AUTH_URL=http://127.0.0.1:3100\n' >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Identite de l'emetteur des factures, LS-126, ajoutee par LS-134.
      #
      # POURQUOI ELLE MANQUAIT SANS QUE RIEN NE ROUGISSE. `emettreFacture` leve
      # `EmetteurNonConfigureError` quand les quatre variables sont absentes, et
      # la confirmation ATTRAPE cette erreur pour ne pas perdre le paiement :
      # elle journalise « Facture non emise, emetteur non configure » et
      # continue. Le defaut etait donc ecrit trente fois dans le journal de
      # chaque execution, en `error`, sans faire echouer une seule assertion.
      #
      # IL S'EST VU QUAND UN TEST A EXIGE UNE CONSEQUENCE DE LA FACTURE : les
      # jetons de LS-134 naissent dans sa transaction, donc aucune facture
      # signifie aucun jeton. Le meme trou faisait passer le test de concurrence
      # de la piece unique, qui servait vingt-cinq acheteurs au lieu d'un.
      #
      # CES VALEURS SONT VOLONTAIREMENT FICTIVES ET LE DISENT. Elles ne sont pas
      # des secrets, contrairement au bloc precedent : une identite legale figure
      # sur un document public. Le prefixe TEST les rend impossibles a confondre
      # avec l'identite reelle de l'exploitante, qui vit dans le `.env` de
      # production et n'entre jamais dans ce depot.
      #
      # Le SIRET compte quatorze chiffres, contrainte de `schemaEmetteurFacture`.
      - name: Composer l'identite de l'emetteur des factures
        run: |
          printf 'FACTURE_RAISON_SOCIALE=%s\n' "TEST Lune et Soleil" >> "$GITHUB_ENV"
          printf 'FACTURE_SIRET=%s\n' "12345678901234" >> "$GITHUB_ENV"
          printf 'FACTURE_ADRESSE=%s\n' "1 rue de Test, 64000 TESTVILLE" >> "$GITHUB_ENV"
          printf 'FACTURE_EMAIL_CONTACT=%s\n' "test-emetteur@example.invalid" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Base publique du site, LS-132 et LS-172.
      #
      # `lienDocument` et `lienRetractation` LEVENT quand elle manque, et c'est
      # deliberement un defaut ferme : un lien errone emporterait un jeton signe
      # hors du domaine, donc vers un tiers.
      #
      # ELLE EST DONC INDISPENSABLE DEPUIS LS-172, qui compose les deux liens
      # DANS la transaction de confirmation. Son absence ne se rattraperait pas
      # comme celle de l'emetteur : l'erreur remonte hors du `catch` de
      # `EmetteurNonConfigureError` et fait echouer la transaction entiere,
      # donc perd le paiement.
      #
      # Le port 3100 est celui de playwright.config.ts, pour que les liens
      # composes pendant la suite de bout en bout designent le serveur servi.
      - name: Composer la base publique du site
        run: |
          printf 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100\n' >> "$GITHUB_ENV"

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # La version vient de .nvmrc et n'est PAS recopiee ici. Prisma 7 refuse
          # les majeures impaires de Node et `engines` est rendu bloquant par
          # engine-strict : une version ecrite en double dans ce fichier
          # divergerait de .nvmrc sans que rien ne le signale, et l'ecart
          # n'apparaitrait qu'a l'installation.
          node-version-file: .nvmrc
          cache: npm

      # ----------------------------------------------------------------------
      # LS-169, la suite longue ne se rejoue pas sur un diff documentaire.
      #
      # CE QUE CETTE ETAPE EXISTE POUR EVITER. Mesure du 3 septembre 2026 : une
      # execution dure treize minutes, dont 678 s pour les scenarios de bout en
      # bout et 268 s pour les tests d'integration. Tout le reste tient en moins
      # de deux minutes. Les pull requests 205 et 206 ne touchaient QUE de la
      # documentation et ont rejoue sept cents tests, tunnel d'achat compris.
      #
      # LA CONDITION VIT SUR LES ETAPES, JAMAIS SUR LE JOB, et ce n'est pas un
      # detail de style. « Les huit controles de CONTRIBUTING » est un controle
      # REQUIS par la protection de branche : un job saute laisserait la pull
      # request en attente d'un resultat qui n'arrive jamais. Un `paths:` au
      # niveau de `on:` produirait le meme blocage.
      #
      # LA DECISION VIT DANS UN SCRIPT, pas dans une expression YAML : elle est
      # ainsi exerçable hors de GitHub, et `verifier-decision-suite.sh` la prouve
      # sur vingt-quatre cas. Trois mutations ont ete jouees, trois detectees,
      # dont une qui a REVELE UN CAS MANQUANT : retirer l'ancrage de fin de
      # `\.md` laissait vingt-deux cas verts, `src/lib/md-parser.ts` passant pour
      # de la documentation.
      #
      # LA LISTE DES FICHIERS VIENT DE L'API, pas de `git diff`. Le checkout est
      # a profondeur 1 : `origin/main` n'existe pas localement, et une
      # comparaison silencieusement vide ferait basculer la decision. L'augmenter
      # coûterait un clone complet a chaque execution, pour la seule decision.
      #
      # SUR `main`, LE MEME FILTRE S'APPLIQUE DEPUIS LS-176, et l'argument qui
      # l'en exemptait etait faux SUR CE DEPOT.
      #
      # Il disait : « une fusion en rebase rejoue les commits sur une base
      # differente de celle testee ». Vrai en general. Faux ici, parce que
      # `strict` vaut true sur la protection de branche : GitHub EXIGE que la
      # branche soit a jour avec `main` avant de fusionner, donc l'arbre fusionne
      # est exactement celui que la pull request a teste.
      #
      #   gh api repos/krismos64/lune-soleil/branches/main/protection \
      #     --jq .required_status_checks.strict   # true
      #
      # CE LIEN EST UNE CONDITION, PAS UNE OBSERVATION. Si `strict` repassait a
      # false un jour, une fusion pourrait produire un arbre jamais teste, et
      # cette exemption devrait revenir. Le controle `verifier-protection-
      # branche.sh` le verifie a chaque execution plutot que de laisser la
      # protection sauter en silence.
      #
      # MESURE QUI A DECLENCHE LS-176, 3 et 4 septembre 2026 : la chaine tournait
      # DEUX FOIS par livraison, et le second passage rejouait sept cents tests
      # de bout en bout pour une pull request qui ne touchait que du Markdown.
      # ----------------------------------------------------------------------
      - name: Decider de la portee de la suite
        id: portee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SUR UNE POUSSEE DIRECTE, LA SUITE COMPLETE, sans consulter l'API.
          # `main` n'accepte que des fusions de pull request, `enforce_admins`
          # etant actif : ce cas ne se produit donc pas en regime nominal. S'il
          # se produit, c'est que quelque chose d'inattendu est arrive, et le
          # defaut ferme veut alors TOUT executer.
          #
          # `workflow_dispatch` tombe ici aussi, ce qui est le comportement
          # voulu : une relance manuelle sert justement a tout rejouer.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Evenement ${{ github.event_name }} sur ${{ github.ref_name }} : suite complete."
            echo "suite=complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--paginate` EST INDISPENSABLE : l'API rend trente fichiers par page,
          # et une pull request plus large verrait ses fichiers de code disparaitre
          # de la liste. Le defaut serait alors ALLEGE sur un diff qui contient du
          # code, exactement le sens d'erreur que ce filtre doit fermer.
          fichiers=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename' 2>/dev/null || true)

          portee=$(printf '%s\n' "$fichiers" | ./scripts/decider-suite-complete.sh)

          echo "Fichiers modifies :"
          printf '%s\n' "$fichiers" | sed 's/^/  /'
          echo "Portee retenue : $portee"

          echo "suite=$portee" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # Controle 1, installation des dependances avec verrouillage.
      #
      # `npm ci` et non `npm install` : il exige package-lock.json, echoue si le
      # verrou diverge de package.json, et n'ecrit jamais dans le verrou. Une
      # chaine qui met a jour ses dependances toute seule ne teste pas ce qui
      # sera deploye.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # LS-178. `npm ci` VARIE D'UN FACTEUR TRENTE, ET LA CAUSE EST EXTERNE :
      # LE DEBIT DISQUE DE L'EXECUTEUR GITHUB.
      #
      # LE SYMPTOME. Neuf mesures du 4 septembre 2026, meme verrou, meme cache npm
      # restaure, meme version d'executeur : 14, 17, 19, 216, 217, 423, 425, 426,
      # 431 s. Ni la branche, ni le declencheur, ni l'heure ne les separaient.
      #
      # CE QUI A TRANCHE, ET C'EST LA LECON A GARDER. Les HORODATAGES, pas les
      # hypotheses. `--foreground-scripts` avait revele trois scripts
      # d'installation, ce qui les a fait accuser a tort : ils s'executent tous
      # en MOINS D'UNE SECONDE, a 14 s du debut de l'etape. Suivent 6 min 49 de
      # SILENCE COMPLET avant « added 704 packages in 7m ».
      #
      # Ce silence, c'est l'ecriture de `node_modules` sur disque : 1,3 Go pour
      # 704 paquets, soit environ 3,2 Mo/s. Un debit anormalement bas, qui varie
      # d'un executeur a l'autre. Cela explique enfin pourquoi aucun critere du
      # depot ne separait les mesures : la cause n'est pas dans le depot.
      #
      # CINQ HYPOTHESES ONT ETE POSEES ET DEMENTIES, ecrites ici pour qu'on n'y
      # revienne pas :
      #   - le cache npm ne serait pas sauvegarde : FAUX, « Cache restored
      #     successfully », et 0 s au Post signifie « rien a sauvegarder »
      #   - le motif serait binaire, 17 s ou 425 s : FAUX, mesures a 216 et 217 s
      #   - `node_modules` serait deja present sur les runs rapides : FAUX, les
      #     releves disent 0 entree avant et 498 apres
      #   - les `postinstall` seraient couteux : FAUX, moins d'une seconde chacun
      #   - le cache Prisma corrigerait le probleme : FAUX, 423 s avec le cache
      #     restaure contre 425 s sans
      #
      # CE QUI EST GARDE MALGRE TOUT, et pourquoi. Le cache Prisma coute zero et
      # supprime un telechargement de 8 Mo, mesure : le `preinstall` de `prisma`
      # disparait du journal quand il est restaure. `--foreground-scripts` coute
      # zero aussi et rendra visible le jour ou une dependance ajoutera un
      # `postinstall` reellement couteux. Aucun des deux ne resout LS-178.
      #
      # 1,3 Go DE DEPENDANCES EST NORMAL pour Next.js 16, Prisma et Playwright
      # reunis, et l'executeur ne se choisit pas. La cause est donc hors de notre
      # controle, et LS-178 se clot sur ce constat plutot que sur une correction
      # cosmetique, ce que son dernier critere prevoyait explicitement.
      # ----------------------------------------------------------------------
      # LE CACHE PRISMA, ET C'EST LUI QUI MANQUAIT. `cache: npm` de setup-node ne
      # couvre QUE `~/.npm`, les archives venant du registre. Les moteurs Prisma
      # sont telecharges par un `postinstall` depuis les serveurs de Prisma, donc
      # hors de ce cache : ils repartaient sur le reseau a chaque execution.
      #
      # LA CLE PORTE LA VERSION DE PRISMA, lue dans le verrou par l'etape
      # precedente. `hashFiles` sur le verrou jetterait ce cache a chaque montee
      # de n'importe quelle dependance, alors que les moteurs ne changent qu'avec
      # Prisma.
      #
      # UN DEFAUT DE CACHE RALENTIT, il ne fait jamais echouer : le `postinstall`
      # retelecharge alors normalement. Meme sens d'erreur que le cache Playwright.
      - name: Version de Prisma pour la cle de cache
        id: prisma
        run: |
          version=$(node -e "const l=require('./package-lock.json'); process.stdout.write(l.packages['node_modules/prisma'].version)")

          # ECHOUER PLUTOT QUE DE POSER UNE CLE VIDE, qui servirait le meme cache
          # a toutes les versions et rendrait le moteur incompatible en silence.
          if [ -z "$version" ]; then
            echo "::error::Version de prisma illisible dans le verrou."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prisma $version"

      - name: Cache des moteurs Prisma
        uses: actions/cache@v6
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ steps.prisma.outputs.version }}

      - name: 1. Installation des dependances
        # `--foreground-scripts` REND VISIBLE CE QUI L'ETAIT PAS, et c'est lui qui
        # a designe la cause de LS-178. Sans cette option, les scripts
        # d'installation tournent en arriere-plan : sept minutes s'ecoulaient sans
        # une seule ligne de journal, et le temps semblait venir de nulle part.
        #
        # IL EST GARDE APRES LE DIAGNOSTIC. Son cout est nul, et il rend visible
        # le jour ou une dependance ajoute un `postinstall` couteux : c'est
        # exactement le defaut qu'on vient de mettre sept mesures a identifier.
        run: npm ci --foreground-scripts

      # `src/generated/prisma` n'est pas versionne : le generateur ecrit plusieurs
      # centaines de fichiers qu'aucune relecture ne couvre. Sans cette etape, la
      # verification des types, l'analyse statique et la construction echouent
      # toutes sur un import introuvable.
      - name: Engendrer le client Prisma
        run: npx prisma generate

      # ----------------------------------------------------------------------
      # Controle 6, premiere moitie : le SQL de REFERENCE dit-il ce qu'on croit ?
      #
      # PLACE EN TETE, avant l'analyse statique et la construction. Ce controle
      # porte le modele de donnees, la partie du systeme ou un defaut coute le
      # plus cher et se repare le moins bien.
      #
      # Mode conception, sans argument : le script demarre SON PROPRE conteneur
      # jetable sur le port 55414, y applique schema.sql et les deux fichiers de
      # contraintes, puis le detruit. Il ne touche pas a la base migree ci-apres.
      #
      # Il sort en code 2 quand sa preparation echoue, distinct du code 1 d'un
      # controle en echec, et n'execute alors AUCUNE assertion plutot que
      # d'afficher des reussites qui ne verifient rien. Les deux codes font
      # echouer cette etape, ce que le critere d'acceptation exige : zero
      # controle execute n'est jamais un succes.
      # ----------------------------------------------------------------------
      - name: 6. Validation du schema de reference
        run: ./prisma/sql-manuel/verifier-schema.sh

      # La base que le mode « realite » attend. Nom, role et base identiques a
      # docker-compose.yml, que l'integration continue ne peut pas employer : ce
      # fichier exige un .env, absent ici et jamais commite.
      #
      # Ni volume ni redemarrage : ce conteneur meurt avec le runner.
      - name: Demarrer la base de controle
        run: |
          docker run -d --name lune-soleil-db \
            -e POSTGRES_USER="$PGUSER" \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e POSTGRES_DB="$PGDATABASE" \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C.UTF-8" \
            -p "127.0.0.1:$PGPORT:5432" \
            postgres:18.4

          # `pg_isready` seul repond avant que la base applicative n'existe. La
          # requete confirme que POSTGRES_DB accepte les connexions, meme motif
          # que le healthcheck de docker-compose.yml.
          for _ in $(seq 1 30); do
            if docker exec lune-soleil-db \
                 psql -U "$PGUSER" -d "$PGDATABASE" -c 'SELECT 1' >/dev/null 2>&1; then
              echo "base prete"
              exit 0
            fi
            sleep 2
          done
          echo "la base n'est pas prete apres 60 secondes"
          docker logs lune-soleil-db
          exit 1

      # Le schema arrive par les migrations versionnees, jamais par le SQL de
      # reference : c'est ce qui rend le controle suivant capable de voir une
      # divergence entre schema.prisma et schema.sql.
      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      # ----------------------------------------------------------------------
      # Controle 6, seconde moitie : Prisma cree-t-il ce que le SQL de reference
      # decrit ?
      #
      # LES DEUX MODES NE SONT PAS REDONDANTS. Le premier valide l'intention, le
      # second valide ce que la production recevra reellement. Une divergence
      # entre schema.prisma et schema.sql n'est visible QUE par celui-ci : le
      # premier passerait au vert sur un SQL de reference juste et une migration
      # fausse. C'est exactement le defaut passe le 29 juillet.
      # ----------------------------------------------------------------------
      - name: 6b. Validation du schema reellement migre
        run: ./prisma/sql-manuel/verifier-schema.sh --base-migree

      # Coherence de .claude/rules/ avec le schema : purement textuel, quelques
      # secondes, aucune base requise. Il attrape les identifiants de regles
      # fantomes, trois trouves lors de son ecriture.
      - name: 6c. Regles Claude confrontees au schema
        run: ./scripts/verifier-regles.sh

      # Coherence du registre des traitements avec le schema, LS-90. Textuel lui
      # aussi, aucune base requise. Il attrape la table qui entre au schema sans
      # entrer au registre, defaut qui ne fait rougir ni type ni test, et refuse
      # qu'une table portant un champ personnel soit rangee hors traitement.
      - name: 6d. Registre des traitements confronte au schema
        run: ./scripts/verifier-registre-traitements.sh

      # `--strict` sort en 1 sur anomalie, mode ecrit pour cette story. Sans lui
      # le script se contente d'avertir, ce qui convient au hook `Stop` de fin de
      # session mais laisserait passer une derive ici.
      #
      # Il attrape ce qui casse aucun test : un ADR absent de la table
      # d'aiguillage, un CLAUDE.md au-dela de 200 lignes, un renvoi vers un
      # fichier inexistant, une fiche memoire hors index, un journal manquant
      # alors que du code a ete commite.
      - name: 9a. Coherence de la configuration Claude Code
        run: ./scripts/verifier-config-claude.sh --strict

      # Preuve par mutation du sens « numeros d'etape en doublon » de l'etape
      # precedente, LS-202. Textuel, secondes.
      #
      # CINQ SENS EXERCES, dont deux qui gardent le controle CONTRE LUI-MEME :
      # deux jobs portant chacun une etape « 1. » ne doivent pas rougir, ce sont
      # deux sequences independantes ; et `9c bis` ne fait pas doublon avec
      # `9c`, sans quoi la convention des preuves par mutation serait accusee
      # partout ou elle est appliquee.
      - name: 9a bis. Preuve par mutation de la numerotation des etapes
        run: ./scripts/verifier-numerotation-etapes-mutation.sh

      # Coherence des actions sensibles avec ADR-027, LS-81 puis LS-99. Textuel,
      # aucune base requise.
      #
      # CE SCRIPT EXISTAIT DEPUIS LS-81 SANS TOURNER NULLE PART : ni ici, ni
      # dans un hook, ni cite par CONTRIBUTING. Trouve le 13 aout 2026 en
      # verifiant la traçabilite de LS-99, qui venait de lui ajouter un sixieme
      # sens. Un controle que rien ne declenche ne protege rien, et c'est le
      # meme motif que le garde-fou jamais exerce deja rencontre ici.
      #
      # CE QU'IL GARDE : une action marquee @sensible sans sa garde, une famille
      # declaree que plus rien ne couvre, une ligne d'attente perimee, et depuis
      # LS-99 une Server Action d'administration sans exigerAdministratrice.
      # Aucun type, aucun test et aucun rendu ne bougent sur ces defauts.
      - name: 9b. Actions sensibles confrontees a ADR-027
        run: ./scripts/verifier-actions-sensibles.sh

      # Garde de role sur TOUTE Server Action d'administration, LS-121. Textuel.
      #
      # POURQUOI IL NE FAIT PAS DOUBLON avec 9b, qui cite pourtant
      # exigerAdministratrice. Celui-ci ne regarde que les fichiers touchant a
      # la REAUTHENTIFICATION : il passe explicitement sur tous les autres. Une
      # action d'administration ordinaire, sans garde de fraicheur, lui echappe
      # entierement. Verifie le 27 aout 2026 sur `changerStatut` de LS-121.
      #
      # POURQUOI UN CONTROLE TEXTUEL, alors que le projet prefere les tests. La
      # garde appelle headers() de Next.js, qui exige un contexte de requete :
      # hors du serveur elle leve avant toute verification. Et le test e2e
      # d'appel direct ne l'atteint pas non plus, un POST sans en-tete
      # Next-Action etant traite en navigation. Mesure : la mutation qui retire
      # la garde laissait les 54 tests de catalogue-administration verts.
      #
      # CE QU'IL VERIFIE PAR FONCTION ET NON PAR FICHIER : une action non gardee
      # voisine de trois actions gardees serait sinon invisible.
      - name: 9c. Gardes de role des Server Actions d'administration
        run: ./scripts/verifier-gardes-administration.sh

      # Preuve par mutation du controle precedent, LS-159. Textuel, secondes.
      #
      # POURQUOI IL EXISTE. Le controle 9c annoncait « 20 actions, toutes
      # gardees » alors que le depot en portait 29 : son releve cherchait
      # `-name "actions.ts"` et ne voyait pas les trois fichiers `actions-*.ts`,
      # soit NEUF actions hors de sa boucle. Les neuf etaient gardees, le trou
      # etait dans le filet, et rien ne l'aurait signale : un controle vert sur
      # une cible absente ressemble a un controle vert sur du code sain.
      #
      # CE QU'IL PROUVE : une garde retiree dans CHACUN des trois fichiers
      # autrefois invisibles fait echouer 9c en NOMMANT l'action. Sans lui,
      # l'elargissement du motif resterait une intention.
      - name: 9c bis. Preuve par mutation des gardes d'administration
        run: ./scripts/verifier-gardes-administration-mutation.sh

      # Resolution de l'adresse client derriere le proxy, LS-91. Textuel, aucune
      # base ni conteneur requis.
      #
      # CE QU'IL GARDE tient en une directive Nginx, et le defaut qu'il attrape
      # est SILENCIEUX : remplacer $remote_addr par la forme repandue
      # $proxy_add_x_forwarded_for laisse le site fonctionner normalement,
      # pendant que la colonne adresse_ip du journal des connexions se vide au
      # gre des visiteurs qui envoient un en-tete non analysable. Aucun type,
      # aucun test applicatif et aucun rendu ne bougent.
      - name: 9d. Resolution de l'adresse client derriere le proxy
        run: ./scripts/verifier-nginx.sh

      # Rendu du contenu des sections de fiche produit, LS-100, regle C23.
      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : `SectionProduit.contenu` est du texte libre saisi dans
      # l'administration et affiche sur une page publique. Une seule ligne de
      # dangerouslySetInnerHTML, ou de ses deux equivalents innerHTML = et
      # insertAdjacentHTML, en fait une injection de script. Le defaut est
      # SILENCIEUX : les types passent, les tests passent, et la page s'affiche
      # meme mieux puisque les sauts de ligne deviennent du balisage.
      #
      # Son second sens verifie que frontend-design.md enonce toujours la regle :
      # un controle qui applique une interdiction qu'aucun document ne porte
      # laisse la session suivante l'ignorer de bonne foi.
      - name: 9e. Contenu de section rendu en texte simple
        run: ./scripts/verifier-rendu-texte-simple.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : le contraste de toute paire couleur et fond employee
      # dans `src/`, LS-84. Il est GENERIQUE par arbitrage du 19 aout 2026 : il
      # mesure un rapport plutot que de chercher un nom de jeton, parce que le
      # defaut est venu deux fois d'un jeton parfaitement legitime pose sur le
      # mauvais fond. `--ls-text-muted` donne 4,86:1 sur creme et 4,35:1 sur
      # sable : interdire le jeton serait faux, l'autoriser sans regarder son
      # fond l'est aussi.
      #
      # IL NE FAIT PAS DOUBLE EMPLOI AVEC axe-core, qui tourne plus bas dans la
      # suite de bout en bout. `axe-core` voit l'heritage mais seulement sur les
      # branches RENDUES, et deux defauts reels sont passes par ce trou, LS-121
      # et LS-130, tous deux sur un etat que les donnees de test ne produisaient
      # jamais. Ce script lit le CSS : il voit les branches que personne
      # n'amorce, et ne voit pas l'heritage. Retirer l'un rouvre une moitie.
      - name: 9f. Contraste des paires couleur et fond
        run: ./scripts/verifier-contraste.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : la bordure d'un controle de saisie, regle C36, LS-108.
      # WCAG 2.2 critere 1.4.11 exige 3:1 pour ce qui identifie un controle, et
      # `--ls-border` donne 1,57:1 sur blanc. Le defaut a vecu vingt-trois jours
      # sur vingt-cinq fichiers d'ecran, les champs y etant invisibles a vide.
      #
      # IL NE FAIT PAS DOUBLE EMPLOI AVEC 9f, ET C'EST STRUCTUREL. L'etape
      # precedente ecarte DELIBEREMENT toute propriete en `-color` par un
      # `(?<!-)` devant `color`, sans quoi une bordure decorative serait mesuree
      # comme du texte et le controle accuserait du code correct. La consequence
      # est qu'AUCUNE bordure n'etait mesuree nulle part, et c'est par ce trou
      # que le defaut de LS-108 est passe. Les deux etapes mesurent deux choses
      # disjointes, avec les deux seuils que la norme distingue :
      #
      #   9f  texte sur fond          4,5:1, ou 3:1 si large
      #   9g  bordure d'un controle   3:1, sans exception de taille
      #
      # SA PORTE DE SORTIE EST EPROUVEE. Un marqueur `@bordure-decorative` pose
      # dans le CSS exempte un element que son fond ou son texte identifie deja,
      # et le script EXIGE une raison ecrite : sans elle, n'importe quel defaut
      # se tairait d'un commentaire de trois mots. Le cas 4 de sa preuve par
      # mutation exerce precisement ce refus.
      - name: 9g. Bordure des controles de saisie, seuil de 3:1
        run: ./scripts/verifier-bordure-controle.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : qu'aucun `loading.tsx` ne soit pose sur une route qui
      # appelle `notFound()`, LS-146. La frontiere Suspense du segment demarre
      # le streaming AVANT que l'appel soit atteint, et Next.js ne peut plus
      # changer le statut d'une reponse commencee : il laisse 200 et ajoute un
      # `noindex`. Mesure en LS-111, 404 sans le fichier et 200 avec.
      #
      # LE DEFAUT EST INVISIBLE A L'ECRAN, la page rendue etant identique dans
      # les deux cas. Un moteur indexerait une fiche produit inexistante en 200,
      # et le SEO est prioritaire sur ce projet. Le geste qui l'introduit est
      # celui d'une bonne intention : `frontend-design.md` EXIGE un etat de
      # chargement, et l'ajouter parait etre une amelioration.
      #
      # Son second sens verifie que les trois pages d'erreur existent toujours :
      # sans lui, le controle resterait vert sur le depot d'AVANT LS-146, ou
      # aucune n'existait.
      - name: 9h. Aucun loading.tsx ne masque un 404
        run: ./scripts/verifier-loading-et-404.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : tout ecran d'administration en `force-dynamic` porte un
      # etat de chargement, LS-188. Quinze ecrans n'en avaient aucun, chaque
      # navigation attendant le rendu serveur complet sans que rien ne bouge a
      # l'ecran.
      #
      # AUCUN TEST DE RENDU NE PEUT VOIR CE DEFAUT au moment de l'ecriture :
      # Playwright attend que la page soit chargee, donc il observe precisement
      # l'instant ou l'armature a disparu. Le seizieme ecran reproduirait
      # l'oubli sans qu'aucune assertion ne rougisse.
      #
      # IL EST LE PENDANT DE 9h, ET LES DEUX SONT NECESSAIRES : celui-ci EXIGE
      # un etat de chargement, 9h INTERDIT la forme qui casserait le 404. Un
      # ecran dont un descendant appelle `notFound()` doit satisfaire les deux,
      # donc passer par un `<Suspense>` interne.
      - name: 9i. Tout ecran d'administration a un etat de chargement
        run: ./scripts/verifier-chargement-administration.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : le lien d'evitement de l'administration et la cible de
      # chaque ecran, LS-194. WCAG 2.4.1 niveau A. Le defaut a vecu seize ecrans
      # parce que chaque story ajoutait le sien sans rien pour signaler l'oubli.
      #
      # IL EST LE PENDANT TEXTUEL DU TEST DE FOCUS de la suite de bout en bout,
      # et les deux sont necessaires. Le test exerce UN ecran et prouve ce
      # qu'aucun texte ne peut voir, que le focus se DEPLACE vraiment. Ce
      # controle couvre les vingt-cinq et attrape le vingt-sixieme des son
      # ecriture, ce qu'aucun test ne fait.
      - name: 9j. Le lien d'evitement de l'administration a sa cible partout
        run: ./scripts/verifier-lien-evitement.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : la ponctuation des annonces de chargement, LS-195,
      # regle C35. Une attente en cours se dit avec des points de suspension,
      # le point final annoncant un chargement termine alors qu'il commence.
      #
      # LE DEFAUT QU'IL FERME EST UNE RECOPIE INVERSEE. Le catalogue public a
      # porte le point final de LS-104 a LS-195, alors qu'il etait la REFERENCE
      # citee par le composant partage : les quinze copies ont corrige la forme
      # sans que l'original le soit. Aucune relecture de diff ne montre cela.
      #
      # IL VERIFIE AUSSI LE CARACTERE, trois points successifs passant la
      # relecture visuelle sans s'entendre ni se chercher de la meme facon.
      - name: 9k. Les annonces de chargement se terminent par des points de suspension
        run: ./scripts/verifier-ponctuation-chargement.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : la bascule de lisibilite du mot de passe, LS-179.
      # ADR-023 impose seize caracteres minimum, et les saisir sans pouvoir les
      # relire fait raccourcir le mot de passe jusqu'a la limite basse, ou
      # renoncer a l'inscription.
      #
      # IL EST LE PENDANT TEXTUEL des tests en jsdom et des mesures de rendu, et
      # les trois sont necessaires. Le jsdom prouve le comportement du
      # composant, la suite de bout en bout mesure les 44 px sur DEUX ecrans ;
      # ce controle couvre les SIX champs et attrape le septieme des son
      # ecriture, ce qu'aucun des deux ne fait.
      #
      # LE TICKET N'EN LISTAIT QUE QUATRE quand le depot en portait six, les
      # deux champs du profil ayant ete oublies. Une liste ecrite a la main est
      # une opinion ; ce controle relit le depot.
      - name: 9l. Tout champ de mot de passe client porte sa bascule
        run: ./scripts/verifier-bascule-mot-de-passe.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # `--exemple-seul` PARCE QUE LA CHAINE N'A PAS DE `.env` et n'en aura
      # jamais : le fichier n'est pas commite et ne doit pas l'etre. Ce mode ne
      # verifie que la coherence de `.env.example`, qui est versionne, et il
      # ANNONCE ce qu'il n'a pas pu verifier plutot que de conclure au vert.
      #
      # CE QU'IL GARDE : un marqueur `@facultative` pose sans raison, LS-156.
      # Rendre une variable optionnelle demande alors un geste ET sa
      # justification ; sans ce sens, la liste des facultatives grossirait sans
      # que rien ne l'interroge, et une variable requise deviendrait optionnelle
      # d'un trait de plume.
      #
      # LE CONTROLE COMPLET RESTE UN OUTIL DE POSTE, presence, forme, doublons,
      # concordance du secret de webhook et processus exposes. Il a trouve deux
      # defauts reels le jour de son ecriture, dont un secret de webhook
      # indiscernable a l'oeil du bon.
      - name: 9m. Le fichier .env.example est coherent
        run: ./scripts/verifier-environnement.sh --exemple-seul

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : le refus, par le hook de secrets, d'une commande
      # portant une VALEUR de secret en argument, LS-156 critere 6. Une valeur
      # passee en argument est lisible par tout `ps` de la machine, et elle est
      # deja ressortie une fois dans une sortie de `pgrep`, le 31 aout 2026.
      #
      # IL VERIFIE LES DEUX SENS, et c'est la moitie qui compte : un hook qui
      # refuse tout serait « sur » et se ferait desactiver a la premiere gene.
      # Cinq commandes legitimes doivent passer, cinq fuites doivent etre
      # refusees.
      - name: 9n. Le hook refuse un secret passe en argument
        run: ./scripts/verifier-hook-secret-argument.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : le generateur des medias de test, LS-187. Il recopie
      # les chemins de la fixture et les declinaisons d'ADR-007, faute de
      # pouvoir les importer : il tourne AVANT `next build`, hors du contexte de
      # Playwright et de ses alias de module.
      #
      # DEUX SOURCES DE VERITE NE RESTENT EGALES QUE SI QUELQUE CHOSE LES
      # COMPARE. Un media de test ou une largeur ajoutee sans etre engendree
      # ferait pointer les URL vers des fichiers absents, et le test des sept
      # URL rougirait en accusant le code.
      - name: 9o. Le generateur de medias de test est aligne sur ses sources
        run: ./scripts/verifier-medias-test.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : les metadonnees de referencement de toute route, LS-137.
      # Une page publique sans `title`, `description` ou canonical, une page
      # PRIVEE sans `noindex`, un titre qui reecrit le nom de la boutique que le
      # gabarit du layout ajoute deja, et la disparition de `metadataBase`,
      # `sitemap.ts` ou `robots.ts`.
      #
      # LES QUATRE DEFAUTS SONT INVISIBLES A L'ECRAN. La page s'affiche
      # parfaitement, elle est seulement mal indexee, et cela se constate des
      # semaines plus tard en voyant qu'elle ne remonte pas. Le plus couteux est
      # le `noindex` manquant sur un ecran interne : retirer une page d'un index
      # public prend des semaines quand l'y faire entrer prend un jour.
      #
      # IL EST GENERIQUE, jamais une liste de pages ecrite a la main : il part
      # de `find` sur les `page.tsx`, une liste manuelle etant une opinion sur ce
      # qui existe, qui se perime au premier ecran ajoute.
      #
      # CE QU'IL NE VOIT PAS, et c'est assume : la JUSTESSE d'un canonical, et
      # toute route servie par un `route.ts`, qu'il n'enumere pas. Ces deux
      # points sont couverts par `tests/e2e/referencement.spec.ts`, qui lit le
      # HTML et les fichiers reellement servis. Un controle textuel ne remplace
      # pas un test d'execution.
      - name: 9p. Metadonnees de referencement
        run: ./scripts/verifier-seo.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : les trois emplacements de la mention de retractation
      # imposes par l'article L221-23, LS-136. Le tunnel avant validation, les
      # conditions generales, et le formulaire type.
      #
      # L'ENJEU N'EST PAS PROPORTIONNEL A LA TAILLE DU TEXTE. L'article L221-20
      # porte le delai de retractation a DOUZE MOIS quand l'information est
      # absente ou incorrecte, sur toutes les commandes concernees. Une mention
      # retiree lors d'une refonte de gabarit ne casse aucun test de rendu et ne
      # se voit sur aucun ecran : la page reste correcte, elle est devenue
      # illegale.
      #
      # L'EMPLACEMENT DU TUNNEL MANQUAIT ENTIEREMENT avant LS-136, mesure le
      # 5 septembre 2026 : zero occurrence du mot « retractation » dans tout le
      # tunnel, quand les conditions generales en portaient six. C'est celui que
      # legal.md designe comme « le premier qu'on oublie ».
      #
      # CE QU'IL NE VOIT PAS : qu'une mention presente dans le code soit
      # reellement RENDUE. C'est `tests/e2e/mentions-retractation.spec.ts` qui
      # lit le HTML servi et mesure la position de la mention par rapport au
      # bouton d'engagement.
      - name: 9q. Mentions de retractation aux trois emplacements
        run: ./scripts/verifier-mentions-retractation.sh

      # Textuel, aucune base ni conteneur requis.
      #
      # CE QU'IL GARDE : les quatre couleurs recopiees en dur dans l'ecran de
      # dernier recours, LS-146. `global-error.tsx` REMPLACE le layout racine,
      # donc les imports de `tokens.css` : s'appuyer sur une variable CSS y
      # reviendrait a dependre du fichier dont la defaillance amene cette page.
      #
      # POURQUOI UN CONTROLE PLUTOT QU'UNE RELECTURE. Cet ecran ne se rend que
      # si le layout racine a echoue : aucun test de rendu ne le traverse, et
      # aucune session de developpement ne l'affiche. Le jour ou ADR-022 change
      # une couleur, la copie diverge en SILENCE et la divergence se decouvre
      # pendant la panne, sur l'ecran qui doit inspirer confiance.
      - name: 9r. Palette de secours alignee sur ADR-022
        run: ./scripts/verifier-palette-secours.sh
      # CE QU'IL GARDE : que chaque ecran d'administration livre soit atteignable
      # depuis la barre, LS-162. Il confronte les rubriques declarees aux routes
      # du depot DANS LES DEUX SENS, et le second est celui qui compte : une
      # route ni navigable ni exclue fait echouer le controle.
      #
      # C'EST LE DEFAUT D'ORIGINE QU'IL EMPECHE DE REVENIR. Huit stories ont
      # ajoute un ecran sans le relier aux autres, et rien ne le signalait : les
      # tests de bout en bout appellent `page.goto()` avec l'URL en dur, donc
      # l'absence totale de menu ne faisait rougir aucune assertion. Une liste
      # ecrite a la main reproduirait le motif d'un cran plus loin.
      - name: 9s. Chaque ecran d'administration est navigable
        run: ./scripts/verifier-navigation-administration.sh

      # C40 : UN LIEN VERS UNE ROUTE `force-dynamic` DESACTIVE LE PRECHARGEMENT.
      #
      # `<Link>` precharge par defaut et `staleTimes.dynamic` vaut zero : la
      # reponse prechargee d'une route dynamique est perimee des son arrivee,
      # Next.js la jette, repart, et RECOMMENCE SANS FIN tant que le lien est a
      # l'ecran. Toutes les routes d'administration sont `force-dynamic`.
      #
      # Ce n'est pas qu'une depense de rendus serveur. La navigation reelle
      # entre en concurrence avec ce flot et perd parfois la course : mesure en
      # LS-166, toujours bloque apres 61 secondes, deux essais sur quatre, sur
      # une page vide sans rien qui dise quoi faire.
      #
      # CE CONTROLE EXISTAIT DEPUIS LE 7 SEPTEMBRE 2026 SANS ETRE BRANCHE ICI,
      # et TROIS liens le violaient sur `main` pendant ce temps, LS-213. Un
      # controle ecrit, prouve par mutation, et declenche par rien ne garde
      # rien : il donne l'assurance d'une garde sans en exercer aucune. Meme
      # motif que `verifier-actions-sensibles.sh`, qui dormait depuis LS-81.
      - name: 9s bis. Les liens d'administration desactivent le prechargement
        run: ./scripts/verifier-prefetch-administration.sh

      # DEUX CONTROLES DE PLUS, TROUVES EN CHERCHANT LE PREMIER, LS-213.
      #
      # Le quatrieme critere du ticket demandait de confronter les scripts du
      # depot a `.github/workflows/` plutot que de se fier a une liste ecrite a
      # la main. Sur 85 scripts `verifier-*`, 35 n'etaient references nulle
      # part ; 26 sont des scripts `-mutation`, qui prouvent les controles et
      # n'ont pas vocation a tourner par pull request.
      #
      # Restaient neuf controles reels. Six ne PEUVENT pas tourner ici, visant
      # la production ou exigeant un acces SSH ou des variables absentes. Ces
      # deux-la etaient verts et jouables tels quels, sans rien changer.
      #
      # `verifier-graphie-marque.sh` est celui dont le depot retient qu'il a ete
      # prouve par quatre mutations reussies pendant qu'il laissait passer
      # QUATRE defauts reels, dont l'en-tete de toutes les pages publiques. Le
      # brancher ne repare pas cette limite, il l'expose : un controle qui
      # tourne se corrige, un controle qui dort ne se corrige jamais.
      - name: 9s ter. La graphie de la marque est uniforme
        run: ./scripts/verifier-graphie-marque.sh

      - name: 9s quater. L'emetteur des factures est coherent
        run: ./scripts/verifier-emetteur-facture.sh

      # ----------------------------------------------------------------------
      # Controle 9t, LS-191. La page qui LEVE a dessein reste inatteignable.
      #
      # `administration/echec-rendu` existe pour que la suite de bout en bout
      # traverse la vraie frontiere d'erreur, sous le vrai layout : le critere 6
      # de la story refuse une frontiere qu'aucun test n'a franchie.
      #
      # SA SEULE PROTECTION EST L'ORDRE DE DEUX INSTRUCTIONS, `notFound()` avant
      # `throw`. Les inverser laisse un fichier qui se relit sans alerter, et
      # donne a quiconque atteint le site le moyen de provoquer une erreur
      # serveur a volonte. Aucun test d'execution ne le verrait : la garde
      # placee apres le `throw` ne s'exprime jamais.
      # ----------------------------------------------------------------------
      - name: 9t. La route d'echec reste gardee
        run: ./scripts/verifier-route-echec.sh

      # Preuve par mutation du controle precedent, LS-191. Textuel, secondes.
      #
      # IL A DEJA TROUVE DEUX DEFAUTS REELS, dans le controle et dans lui-meme.
      # Le controle cherchait `notFound()` commentaires compris, donc le trouvait
      # dans la phrase qui EXPLIQUE la garde et restait vert sur l'ordre inverse.
      # Et l'un de ses propres cas ne mutait rien, `\Q...\E` rendant `\n`
      # litteral : il comptait comme non detecte sans qu'aucun defaut n'ait ete
      # introduit.
      - name: 9t bis. Preuve par mutation de la route d'echec
        run: ./scripts/verifier-route-echec-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9u. Les fixtures de bout en bout ne consomment pas le plafond
      # d'inscription, LS-168. Textuel, secondes.
      #
      # CE QU'IL EMPECHE. Une fixture qui fabrique son adresse a l'execution cree
      # un compte NEUF a chaque passage, et `/sign-up/email` n'accepte que trois
      # inscriptions par minute et par IP. La suite se bloque alors elle-meme, et
      # le defaut se voit tres loin de sa cause : la preparation echoue en 429,
      # Playwright marque tous les tests « non executes », et un script de
      # mutation conclut « le test est aveugle » sur des tests voyants.
      #
      # IL EXISTE PARCE QUE LE DEFAUT EST REVENU DEUX FOIS. LS-111 l'a ferme sur
      # la session d'administration, LS-113 sur la session cliente, et il restait
      # entier sur deux autres fichiers jusqu'a LS-168. Chaque correction portait
      # pourtant un commentaire expliquant le piege : ce sont ces commentaires
      # qui n'ont pas suffi.
      #
      # LA MESURE QUI L'A MOTIVE : 118 comptes de test accumules sur la base de
      # developpement, dont 68 laisses par la seule fixture verifiee.
      # ----------------------------------------------------------------------
      - name: 9u. Les fixtures e2e n'inscrivent pas a chaque execution
        run: ./scripts/verifier-fixtures-e2e.sh

      # Preuve par mutation du controle precedent, LS-168. Textuel, secondes.
      #
      # TROIS SENS EXERCES : une adresse construite a l'execution, un reessai
      # espace, et une largeur retiree de `PROJETS_LARGEUR`. Le troisieme est le
      # defaut silencieux, la suite passerait en cessant d'amorcer un compte.
      - name: 9u bis. Preuve par mutation des fixtures e2e
        run: ./scripts/verifier-fixtures-e2e-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9v. Un aria-describedby ne vise jamais un element portant
      # aria-label, LS-161, regle C39. Textuel, secondes.
      #
      # CE QU'IL GARDE, et le defaut est SILENCIEUX : le calcul de la
      # description accessible consulte `aria-label` AVANT le contenu textuel.
      # Un bouton decrit par une region qui porte un label s'annonce avec ce
      # label et jamais avec le texte reel. Aucun type, aucun test et aucun
      # rendu ne bougent, seule une ecoute au lecteur d'ecran le revele.
      #
      # POURQUOI IL SE REINTRODUIT PAR MIMETISME : la justification ecrite dans
      # le fichier etait FAUSSE, elle invoquait le besoin de nommer deux
      # regions `status` d'un meme ecran. Nommer une region live ne change rien
      # a son annonce, seul le CONTENU est vocalise. LS-160 n'avait corrige
      # qu'un des deux ecrans, l'autre a ete recopie de bonne foi.
      # ----------------------------------------------------------------------
      - name: 9v. Aucune description accessible annulee par un aria-label
        run: ./scripts/verifier-description-accessible.sh

      # Preuve par mutation du controle precedent, LS-161. Textuel, secondes.
      #
      # CINQ SENS EXERCES, dont deux qui ne vont pas de soi : un `aria-label`
      # cite EN COMMENTAIRE ne doit pas faire rougir, les deux ecrans corriges
      # nommant l'attribut pour expliquer son absence ; et une cible vivant
      # dans un AUTRE fichier que celui qui la decrit doit etre vue.
      - name: 9v bis. Preuve par mutation des descriptions accessibles
        run: ./scripts/verifier-description-accessible-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9w. Une Server Action revalide le LAYOUT des que le layout lit
      # la donnee, regle C37. Textuel, secondes.
      #
      # CE QU'IL GARDE, et le defaut est SILENCIEUX : `revalidatePath(chemin)`
      # invalide la page seule. Le layout d'administration lit NEUF comptages,
      # et une action qui en change un sans passer `"layout"` rafraichit l'ecran
      # pendant que la barre garde son ancien nombre. Aucun type, aucun test et
      # aucun rendu ne bougent.
      #
      # POURQUOI IL ARRIVE APRES LA REGLE. LS-201 a pose C37 et corrige SIX
      # appels, sur les messages et les stocks seulement. ONZE appels restaient
      # en violation sur quatre autres domaines, trouves le 7 septembre 2026 en
      # cherchant quelles regles numerotees n'etaient exercees par rien. Une
      # regle ecrite et non verifiee ne tient pas.
      # ----------------------------------------------------------------------
      - name: 9w. Revalidation du layout des ecrans d'administration
        run: ./scripts/verifier-revalidation-layout.sh

      # Preuve par mutation du controle precedent, regle C37. Textuel, secondes.
      #
      # SIX SENS EXERCES, dont deux qui gardent le controle CONTRE LUI-MEME : la
      # regle retiree du document, et un argument qui est lui-meme un appel,
      # `revalidatePath(chemin(id), "layout")`, qui a fait rougir la premiere
      # version du controle sur du code parfaitement correct.
      - name: 9w bis. Preuve par mutation de la revalidation du layout
        run: ./scripts/verifier-revalidation-layout-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9x. La suite de bout en bout tourne sur SA base, LS-189.
      # Textuel, secondes.
      #
      # CE QU'IL GARDE, et le defaut a deux faces opposees. La preparation
      # promeut son compte d'administration, et l'index partiel
      # `utilisateur_administratrice_unique` n'admet QU'UNE administratrice,
      # regle E1. Si la suite retombe sur la base de developpement :
      #
      #   - le compte REEL de l'exploitante occupe la place, la preparation
      #     echoue avant tout test et Playwright marque tout « did not run »
      #   - ou bien la clause de retrogradation est elargie pour passer outre,
      #     et c'est le compte reel qui perd son role, en silence
      #
      # LES DEUX SENS SONT DONC INDEPENDANTS, et un seul laisserait un chemin
      # ouvert. Un troisieme garde la comparaison des deux URL : les bases
      # partagent leurs identifiants, seul le PORT les distingue, donc une
      # variable recopiee sans le changer ramenerait le defaut entier pendant
      # que les deux premiers sens resteraient verts.
      #
      # LA CI NE MONTE PAS CETTE BASE et n'en a pas besoin : son PostgreSQL est
      # vierge a chaque execution, sans compte reel a proteger. Ce controle est
      # TEXTUEL, il verifie le dispositif, jamais l'existence du conteneur.
      # ----------------------------------------------------------------------
      - name: 9x. Isolement de la base de bout en bout
        run: ./scripts/verifier-base-e2e.sh

      # Preuve par mutation du controle precedent, LS-189. Textuel, secondes.
      #
      # QUATRE SENS EXERCES, chacun sur un etat qui a REELLEMENT existe ou qui
      # est le chemin naturel vers le defaut : la surcharge absente, soit le
      # depot d'avant la story ; la clause elargie, soit la « correction » qu'il
      # fallait ecarter ; la comparaison des URL retiree ; et l'ancrage casse,
      # qui doit faire ECHOUER le controle plutot que rendre un OK silencieux.
      - name: 9x bis. Preuve par mutation de l'isolement de la base e2e
        run: ./scripts/verifier-base-e2e-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9y. Toute tache declaree est reellement declenchee, LS-206.
      # Textuel, secondes.
      #
      # LE DEFAUT QU'IL FERME A EXISTE. Le 8 septembre 2026, le service
      # declarait CINQ taches et le crontab en planifiait TROIS : `envoi-emails`
      # et `purge-quarantaine-medias` avaient leur service, leur verrou et leur
      # route interne, et RIEN ne les appelait. Un client aurait paye sans
      # recevoir ni confirmation ni facture, pendant que /api/sante rendait 200
      # et que le controle de fumee sortait en 0.
      #
      # AUCUN CONTROLE EXISTANT NE POUVAIT LE VOIR : les deux fichiers vivent
      # dans des mondes separes, TypeScript d'un cote, table de cron de l'autre,
      # et rien ne les confrontait. La cause etait une liste tenue a la main,
      # qui a pris du retard quand LS-82 et LS-102 ont ajoute deux taches.
      - name: 9y. Toute tache planifiee est declenchee
        run: ./scripts/verifier-taches-planifiees.sh

      # Preuve par mutation du controle precedent, LS-206. Textuel, secondes.
      #
      # NEUF SENS EXERCES, dont les deux qui gardent le controle CONTRE
      # LUI-MEME : un ancrage casse doit ABANDONNER en code 2 plutot que
      # comparer deux listes vides et les declarer concordantes.
      #
      # Il verifie aussi que chaque mutation MORD reellement. La premiere
      # version du cas sur le fuseau employait `sed 's/\bUTC\b/'`, qui ne
      # remplace rien sous le sed de BSD : la mutation ne mutait pas, et le
      # controle etait accuse a tort d'etre aveugle.
      - name: 9y bis. Preuve par mutation des taches planifiees
        run: ./scripts/verifier-taches-planifiees-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9z. Les trois plafonds de televersement decroissent dans le
      # bon ordre, LS-207. Textuel, secondes.
      #
      # LE DEFAUT QU'IL FERME A VECU DEPUIS LS-91 : `client_max_body_size`
      # valait 12M quand le service acceptait 25 Mo. Une photographie de 17 Mo,
      # cas eprouve par ADR-007, recevait un 413 de Nginx AVANT que la Server
      # Action ne s'execute, donc sans que le message « 25 Mo au maximum » ne
      # s'affiche jamais : l'ecran restait sur sa progression.
      #
      # C'est le defaut que `next.config.ts` decrit et a corrige a son niveau,
      # reproduit un cran plus haut. Son commentaire DESIGNE cette directive
      # comme la borne de production, et rien ne verifiait qu'elle suivait : les
      # trois valeurs vivent dans trois fichiers sans lien, dans trois unites
      # differentes.
      - name: 9z. Plafonds de corps coherents entre service, Next et Nginx
        run: ./scripts/verifier-plafonds-corps.sh

      # Preuve par mutation du controle precedent, LS-207. Textuel, secondes.
      #
      # DIX SENS EXERCES, dont le seul qui compte vraiment : l'etat REEL du
      # depot avant la correction, `client_max_body_size 12M`, doit etre refuse.
      # Une mutation ne prouve que la forme qu'elle fabrique, donc celle-ci
      # rejoue le defaut tel qu'il a existe et non une forme commode a ecrire.
      - name: 9z bis. Preuve par mutation des plafonds de corps
        run: ./scripts/verifier-plafonds-corps-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9z ter, LS-110. Toute navigation interne passe par `Link`.
      #
      # CE CONTROLE EXISTE PARCE QU'ESLINT NE VOIT PAS CE DEFAUT, et c'est le
      # point qui justifie un script de plus. `@next/next/no-html-link-for-pages`
      # est active en ERREUR par core-web-vitals, et reste muette : mesure sur
      # Next.js 16.2.12, seul `href="/"` la fait rougir, ni `/panier` ni
      # `/administration/categories` ne sont vus. Elle ne signale que le seul
      # lien que personne n'ecrit par erreur.
      #
      # UNE BALISE NATIVE RECHARGE LE DOCUMENT ENTIER, jette le cache de route
      # et repart d'un rendu serveur complet la ou une navigation client
      # suffisait. Le fil d'Ariane de l'editeur de produit le faisait a chaque
      # retour au catalogue.
      #
      # LES RECHARGEMENTS VOULUS SE DECLARENT, marqueur `@rechargement-delibere`
      # avec sa raison : quatre liens du depot rechargent a dessein apres une
      # invalidation de session, et les interdire ferait supprimer la ligne qui
      # protege.
      # ----------------------------------------------------------------------
      - name: 9z ter. Toute navigation interne passe par Link
        run: ./scripts/verifier-navigation-client.sh

      # Preuve par mutation du controle precedent, LS-110. Textuel, secondes.
      # SA MUTATION 3 A TROUVE UN VRAI TROU : le motif employait l'alternance de
      # GNU, que le grep BSD de macOS lit litteralement, et dix des trente et une
      # balises du depot echappaient au controle, dont toutes celles enveloppees
      # sur plusieurs lignes. Le vert etait celui d'un depot examine au tiers.
      - name: 9z quater. Preuve par mutation de la navigation client
        run: ./scripts/verifier-navigation-client-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 9z quinquies, LS-139. Les cinq en-tetes de securite.
      #
      # CE QU'IL GARDE. La production ne servait qu'UN en-tete sur cinq le
      # 9 septembre 2026, HSTS seul, alors que la boutique tourne. Les quatre
      # autres n'etaient ecrits nulle part.
      #
      # LE PIEGE DE NGINX QU'IL ATTRAPE : `add_header` dans un `location`
      # REMPLACE le jeu herite du bloc serveur au lieu de s'y ajouter. Un
      # `location` qui pose un seul en-tete perd donc les quatre autres, en
      # silence. Le bloc `/medias/` etait dans ce cas, et ce sont justement des
      # fichiers TELEVERSES.
      #
      # IL EST TEXTUEL, donc il verifie que les en-tetes sont DECLARES et jamais
      # qu'ils sont SERVIS. `tests/e2e/en-tetes-securite.spec.ts` mesure les
      # reponses reelles ; les deux sont necessaires.
      # ----------------------------------------------------------------------
      - name: 9z quinquies. Les cinq en-tetes de securite sont declares
        run: ./scripts/verifier-en-tetes-securite.sh

      # Preuve par mutation du controle precedent, LS-139 critere 7, qui exige
      # que chaque en-tete fasse rougir SEPAREMENT. Neuf cas, dont deux qui ont
      # trouve le controle aveugle a sa premiere ecriture : il attrapait le
      # COMMENTAIRE expliquant pourquoi `unsafe-inline` est refuse, et il
      # cherchait `development` n'importe ou plutot que sur la ligne qui pose
      # `unsafe-eval`.
      - name: 9z sexies. Preuve par mutation des en-tetes de securite
        run: ./scripts/verifier-en-tetes-securite-mutation.sh

      # ----------------------------------------------------------------------
      # Controles 2 et 3. Le format entre ici parce qu'un depot ou seule une
      # partie des fichiers est formatee produit des diffs illisibles.
      # ----------------------------------------------------------------------
      - name: 2. Analyse statique
        run: npm run lint

      - name: 3. Verification des types
        run: npm run type-check

      - name: 3b. Format
        run: npm run format:check

      # ----------------------------------------------------------------------
      # Controle 3bis, aucun test desactive. Place AVANT les suites : un test
      # ignore les ferait passer au vert sans rien exercer, et echouer ici coute
      # deux secondes au lieu de laisser croire a une suite complete.
      #
      # Mesure le 25 aout 2026 : un `it.skip` pose sur le test phare passait la
      # CI avec un code de sortie 0, la sortie annoncant « 6 passed | 1 skipped ».
      # Le jalon technique majeur du projet se neutralisait en sept caracteres.
      # ----------------------------------------------------------------------
      - name: 3bis. Aucun test ignore ni focalise
        run: ./scripts/verifier-tests-non-ignores.sh

      # ----------------------------------------------------------------------
      # Controle 3ter, ce que le code ajoute se retrouve dans son document.
      #
      # Le 25 aout 2026, VALIDATION.md s'arretait a schemaPanier alors que le
      # socle etait passe de sept a quatorze schemas : le document de reference
      # ignorait la moitie de ce qu'il pretend recenser.
      # ----------------------------------------------------------------------
      # LS-169. Le filtre de portee est du code, il se controle comme tel : sans
      # cette etape, une exemption elargie par megarde ne se verrait que le jour
      # ou une regression passerait. Purement textuel, aucune base ni conteneur,
      # et il tourne dans les DEUX portees : c'est lui qui garde le filtre.
      - name: 3quater. Le filtre de portee distingue documentation et code
        run: ./scripts/verifier-decision-suite.sh

      - name: 3ter. Socle Zod et son document accordes
        run: ./scripts/verifier-propagation-docs.sh

      # LS-176. `verifier-protection-branche.sh` N'EST PAS BRANCHE ICI, ET C'EST
      # UNE DECISION, PAS UN OUBLI.
      #
      # La chaine ne se declenche plus sur `main`, et cette suppression repose
      # sur `required_status_checks.strict`. Le controle qui le verifie a d'abord
      # ete pose a cet endroit, puis retire apres mesure : lire la protection de
      # branche exige la portee `administration: read`, que ce workflow n'accorde
      # pas. Il tourne en `contents: read`, durcissement delibere.
      #
      # LE JETON PAR DEFAUT NE REND PAS UNE REPONSE VIDE, IL REND UN OBJET
      # AMPUTE, sans `required_status_checks`. La premiere version du script a
      # donc lu « absent » et fait echouer la chaine sur une protection pourtant
      # intacte, defaut invisible en local ou le jeton personnel lit tout.
      #
      # ELARGIR LES DROITS POUR LE FAIRE PARLER SERAIT UN MAUVAIS ECHANGE : un
      # droit d'administration a chaque execution, pull request venue d'ailleurs
      # comprise, pour un controle de coherence. Il tourne donc dans
      # `derive-documentation.yml`, hebdomadaire, ou la portee est accordee sans
      # exposer la chaine de fusion, et en local ou il conclut aussi.
      #
      # LS-176. L'etape d'audit ne fait plus echouer sur une panne du registre :
      # ce controle prouve que le relachement reste ETROIT, et qu'une
      # vulnerabilite continue de bloquer. Purement textuel, il tourne dans les
      # deux portees comme le garde du filtre.
      - name: 3sexies. Panne du registre et vulnerabilite sont distinguees
        run: ./scripts/verifier-verdict-audit.sh

      # ----------------------------------------------------------------------
      # Controle 4, tests unitaires. Sans base, rapides, ils cadrent les erreurs
      # de manipulation d'URL de connexion.
      # ----------------------------------------------------------------------
      - name: 4. Tests unitaires
        run: npm run test:unitaire

      # ----------------------------------------------------------------------
      # Controle 4bis, tests de composant en jsdom. Ni base ni navigateur, LS-113.
      #
      # POURQUOI UN PROJET DE PLUS. Certains etats dependent d'une donnee
      # GLOBALEMENT absente : les deux etats vides « aucune categorie »
      # s'affichent quand la table entiere est vide, ce que la fixture de bout
      # en bout ne peut pas produire, et vider la table en cours de suite ferait
      # voir cet etat aux travailleurs voisins, la base etant partagee.
      #
      # C'EST LE PREMIER ECRAN QUE VERRA L'EXPLOITANTE sur une boutique qui
      # demarre, et rien ne le protegeait.
      - name: 4bis. Tests de composant
        run: npm run test:composant

      # ----------------------------------------------------------------------
      # Controle 5, tests d'integration sur base ephemere.
      #
      # La preparation globale cree une base au nom unique sur le meme serveur,
      # y applique `migrate deploy`, et la detruit apres la suite. Elle ECHOUE
      # plutot que d'ignorer les tests si la base est injoignable : un controle
      # qui se desactive tout seul quand son environnement manque afficherait
      # « aucun echec » ici meme, et le jour ou la reservation casserait personne
      # ne le saurait.
      #
      # C'est l'etape qui porte le jalon du projet, la vente du dernier
      # exemplaire en concurrence.
      # ----------------------------------------------------------------------
      - name: 5. Tests d'integration sur base ephemere
        if: steps.portee.outputs.suite == 'complete'
        run: npm run test:integration

      # ----------------------------------------------------------------------
      # Controle 7, construction de l'application.
      #
      # Explicite malgre le `npm run build` que playwright.config.ts declenche :
      # un echec de construction doit se lire sur son propre pas, pas au fond du
      # journal du serveur de test. La seconde construction est servie par le
      # cache de Next.js.
      # ----------------------------------------------------------------------
      - name: 7. Construction de l'application
        run: npm run build

      # ----------------------------------------------------------------------
      # Controle 7 bis. Le prefixe public des medias atteint le bundle, LS-197.
      #
      # IL PORTE LE NUMERO DE L'ETAPE QU'IL SUIT, ET CE N'EST PAS UN CHOIX DE
      # STYLE : il exige un bundle CONSTRUIT, donc il ne peut pas vivre dans la
      # famille 9 des controles textuels, qui s'execute bien avant. Le placer
      # ailleurs le ferait echouer sur « aucun bundle construit ».
      #
      # CE QU'IL GARDE, et le defaut est SILENCIEUX : une variable
      # `NEXT_PUBLIC_` est substituee a la construction, pas lue a l'execution.
      # Avant LS-197 le Dockerfile ne la portait pas, donc tout `docker build`
      # figeait `/medias` et aucune configuration d'execution ne pouvait le
      # changer. Le site aurait parfaitement fonctionne jusqu'au jour d'un
      # changement de prefixe.
      #
      # Il confronte le bundle REELLEMENT construit a la valeur configuree, ce
      # qu'aucun test de forme d'URL ne peut faire.
      # ----------------------------------------------------------------------
      - name: 7 bis. Le prefixe des medias atteint le bundle
        run: ./scripts/verifier-prefixe-medias.sh

      # Preuve par mutation du controle precedent, LS-197. Textuel, secondes.
      #
      # CINQ SENS EXERCES, dont le plus instructif : l'ENV retire en laissant
      # l'ARG seul. Un Dockerfile dans cet etat semble correct a la relecture et
      # fige pourtant le repli, un ARG n'etant pas exporte dans l'environnement
      # des RUN suivants.
      - name: 7 ter. Preuve par mutation du prefixe des medias
        run: ./scripts/verifier-prefixe-medias-mutation.sh

      # ----------------------------------------------------------------------
      # Controle 8, scenarios de bout en bout.
      #
      # Trois largeurs, 320, 390 et 1280 px, plus axe-core. Le navigateur se
      # telecharge ici, il n'est pas preinstalle sur le runner. `--with-deps`
      # ajoute les bibliotheques systeme que Chromium exige sur Ubuntu.
      #
      # Seul Chromium : ces projets verifient des LARGEURS et non des moteurs de
      # rendu, ajouter WebKit et Firefox couterait deux telechargements par
      # execution sans rien prouver de plus sur le dimensionnement.
      # ----------------------------------------------------------------------
      # BORNE PROPRE A CETTE ETAPE, LS-124. Elle prend 34 a 146 secondes quand
      # elle fonctionne, mesure sur cinq executions. Le 19 aout 2026 elle a
      # bloque deux fois de suite sur le telechargement de Chromium, 17 puis 25
      # minutes, vraisemblablement une indisponibilite du CDN de Playwright.
      #
      # Sans cette borne, l'etape consomme les 45 minutes du job avant que
      # celui-ci n'expire : la chaine echoue alors sur du code sain, et le
      # journal ne nomme pas la cause. Cinq minutes laissent le double du pire
      # cas nominal et font echouer vite, en designant l'etape fautive.
      #
      # ELLE NE CORRIGE PAS L'INDISPONIBILITE, elle la rend lisible. Le cache
      # des binaires est ecarte : la documentation de Playwright le deconseille,
      # le temps de restauration valant celui du telechargement, et les
      # dependances de `--with-deps` n'etant pas cachables.
      #
      # LE CAS S'ETAIT DEJA PRODUIT EN LS-106, voir le commentaire de
      # `timeout-minutes` du job : une annulation a 30 minutes, PENDANT cette
      # meme etape, toutes les precedentes vertes. La reponse d'alors fut de
      # porter la borne du job de 30 a 45 minutes, ce qui a retarde le symptome
      # sans le nommer. Deux occurrences du meme defaut appellent une borne
      # locale, pas un plafond global plus haut.
      #
      # BORNE PROUVEE, LS-124 critere 5 : abaissee temporairement a une minute
      # sur la pull request 135, l'etape a echoue en 73 secondes avec une
      # conclusion `failure`, et les etapes suivantes ont ete ignorees. Une
      # borne jamais franchie ne prouve pas qu'elle protege.
      # ----------------------------------------------------------------------
      # LS-177. LES SCENARIOS DE BOUT EN BOUT NE SONT PLUS ICI, arbitrage
      # explicite de Christophe du 4 septembre 2026. Ils coutaient 5 min 32 sur
      # chaque pull request de code, plusieurs fois par jour pour un developpeur
      # seul, et le cache du navigateur les accompagne.
      #
      # CETTE STORY RETIRE DE LA COUVERTURE AVANT FUSION, contrairement a
      # LS-176 qui n'en retirait aucune. L'arbitrage est trace, pas subi :
      # `nocturne.yml` les rejoue chaque nuit sur les TROIS largeurs et ouvre une
      # issue en cas d'echec.
      #
      # CE QUI RESTE VERIFIE AVANT FUSION, ET C'EST LE POINT QUI DECIDE. Le jalon
      # de CLAUDE.md, « un achat de bout en bout sur une variante en stock a un
      # exemplaire », vit dans `tests/integration/parcours-complet.sequential.test.ts`
      # et non dans la suite Playwright. Verifie avant d'arbitrer. Les tests
      # d'integration restent donc integralement ici, reservation et concurrence
      # comprises : le jalon n'est pas contourne, exigence de CLAUDE.md tenue.
      #
      # CE QUI PART AU NOCTURNE EST L'INTERFACE : seize tests du tunnel d'achat,
      # quatre de la confirmation, plus le catalogue, l'administration et
      # l'espace client. Un debordement a 320 px ou un lien mort peut donc entrer
      # sur `main` et n'etre vu que le lendemain. Le depot a deja connu ces
      # defauts, LS-171 et LS-162.
      #
      # CE RISQUE EST ACCEPTABLE AUJOURD'HUI ET NE LE RESTERA PAS : la boutique
      # n'est pas ouverte commercialement. A RECONSIDERER AVANT LE GO-LIVE,
      # LS-153, quand un defaut d'interface commencera a couter des ventes.
      # ----------------------------------------------------------------------

      # ----------------------------------------------------------------------
      # LS-169 critere 6 : un saut se VOIT, il ne se devine pas.
      #
      # GitHub affiche une etape ignoree en gris, ce qui se distingue mal d'une
      # etape verte dans un journal de trente lignes. Sans ce recapitulatif, une
      # execution allegee et une execution complete se ressemblent, et personne
      # ne remarquerait qu'un filtre trop large a desarme la suite.
      #
      # `always()` PARCE QUE LE RECAPITULATIF COMPTE SURTOUT EN CAS D'ECHEC :
      # savoir qu'une etape n'a PAS tourne fait partie du diagnostic. Il n'est
      # pas conditionne a la portee non plus, une execution complete devant le
      # dire aussi.
      #
      # IL N'AFFIRME PAS QUE LA SUITE EST PASSEE : il dit ce qui a ete EXECUTE.
      # Le resultat des etapes reste porte par leur propre conclusion.
      # ----------------------------------------------------------------------
      - name: Recapitulatif de portee
        if: always()
        run: |
          portee='${{ steps.portee.outputs.suite }}'

          {
            echo "## Portée de cette exécution"
            echo
            if [ "$portee" = "complete" ]; then
              echo "**Suite complète.** Tests unitaires et tests d'intégration"
              echo "inclus, dont le jalon de la pièce unique."
            else
              echo "**Suite allégée**, LS-169 : le diff ne touche que de la"
              echo "documentation."
              echo
              echo "N'A PAS ÉTÉ EXÉCUTÉ :"
              echo "- 5. Tests d'intégration sur base éphémère"
              echo
              echo "Tout le reste a tourné : types, analyse statique, format,"
              echo "schéma, règles et construction."
            fi

            echo
            echo "### Ce que cette chaîne ne vérifie plus, LS-177"
            echo
            echo "Trois contrôles ont quitté la pull request et vivent"
            echo "désormais dans \`nocturne.yml\`, rejoué chaque nuit :"
            echo
            echo "- les **scénarios de bout en bout**, quatre largeurs"
            echo "- \`npm audit\`"
            echo "- la **construction de l'image Docker**, également refaite"
            echo "  sur \`main\` par \`publier-image.yml\`, qui vérifie"
            echo "  désormais AVANT de publier"
            echo
            echo "Un défaut d'interface peut donc entrer sur \`main\` et"
            echo "n'être vu que le lendemain. Le jalon métier, lui, reste"
            echo "vérifié ici : il vit dans les tests d'intégration."
            echo
            echo "LS-176 : la chaîne ne se rejoue plus sur \`main\` après"
            echo "fusion, \`strict\` garantissant que l'arbre fusionné est"
            echo "celui qui vient d'être testé ici. Une relance complète"
            echo "reste possible à la demande, \`workflow_dispatch\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Portée : $portee"

      # ----------------------------------------------------------------------
      # LS-177. LA CONSTRUCTION DE L'IMAGE N'EST PLUS ICI, elle coutait 3 min 25
      # sur CHAQUE pull request, Dockerfile inchange compris.
      #
      # CE QUI ETAIT ECRIT ICI : « une image qui ne se construit pas doit faire
      # rougir la pull request, pas etre decouverte apres la fusion, quand `main`
      # est deja cassee ». L'argument reste valable, il est simplement paye trop
      # cher : le Dockerfile change rarement, et une image qui ne se construit
      # pas est rattrapee par `publier-image.yml` sur du code que tout le reste a
      # deja verifie.
      #
      # CE PAS SERVAIT AUSSI DE BARRIERE AVANT PUBLICATION, SANS QUE CE SOIT SON
      # ROLE DECLARE, et c'est le point qui a failli etre perdu. Le controle des
      # couches protege l'invariant 9, un `.env` entre dans une couche y restant
      # meme supprime ensuite, et GHCR est PUBLIC. Or `publier-image.yml`
      # publiait AVANT de verifier : retirer ce pas sans rien faire d'autre
      # aurait laisse une image fautive atteindre le registre.
      #
      # `publier-image.yml` A DONC ETE REORDONNE dans la meme story : il
      # construit avec `load: true`, verifie, puis publie. La barriere existe
      # toujours, elle est desormais au bon endroit et porte son nom.
      #
      # LE CONTROLE DES COUCHES N'EST PAS AFFAIBLI, il est deplace : meme script,
      # meme image, `verifier-image-docker.sh`, et sa preuve par mutation vit
      # toujours dans `scripts/verifier-image-docker-mutation.sh`.
      # ----------------------------------------------------------------------

      # Le rapport n'existe qu'en cas d'echec exploitable ; `if: failure()` evite
      # de televerser un dossier vide a chaque execution verte.
      #
      # LS-177 : les scenarios de bout en bout sont passes au controle nocturne,
      # ce pas ne sert donc plus que si un jour ils reviennent ici. Il est garde
      # inerte plutot que supprime, `if: failure()` le rendant gratuit.
      - name: Rapport Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

      # ----------------------------------------------------------------------
      # LS-177. `npm audit` N'EST PLUS ICI, et c'est le deplacement le mieux
      # fonde des trois.
      #
      # UNE VULNERABILITE N'APPARAIT PAS PARCE QU'UN COMPOSANT A CHANGE, elle
      # apparait parce qu'un avis de securite est PUBLIE. La lier a une pull
      # request n'a jamais eu de sens : le meme verrou, inchange, est sain un
      # jour et vulnerable le lendemain sans qu'aucun commit ne l'explique.
      #
      # ELLE COUTAIT 4 min 37 le 4 septembre, sur une pull request qui ne
      # touchait pas une seule dependance.
      #
      # `nocturne.yml` LA REJOUE CHAQUE NUIT, `--audit-level=low` inchange, et
      # ouvre une issue en cas de vulnerabilite. L'invariant de CLAUDE.md, npm
      # audit a zero, reste tenu : il est verifie chaque jour au lieu d'etre
      # verifie a chaque commit.
      #
      # LA DISTINCTION PANNE / VULNERABILITE DE LS-176 PART AVEC ELLE, et
      # `verifier-verdict-audit.sh` la suit : son garde-fou cherche desormais le
      # motif dans `nocturne.yml`. Il reste branche ICI, purement textuel, parce
      # qu'il protege une decision de securite qui doit rougir avant fusion si
      # quelqu'un l'affaiblit.
      # ----------------------------------------------------------------------
