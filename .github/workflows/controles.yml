# Chaine d'integration continue, LS-69.
#
# Execute les huit controles de CONTRIBUTING.md sur chaque pull request vers
# main, et sur main apres fusion. Avant cette story, aucun ne tournait
# automatiquement : ils dependaient de quelqu'un qui pense a les lancer, et
# l'oubli s'est produit au moins trois fois, dont un defaut de schema passe le
# 29 juillet 2026 alors que verifier-schema.sh existait depuis deux jours.
#
# CE FICHIER A ETE PROUVE ROUGE, et pas seulement vert. La pull request 59,
# jetable et depuis fermee, portait chk_variante_pas_de_survente retiree du SQL
# de reference : l'etape 6 a echoue sur « 91 reussites, 1 echecs » et la chaine
# s'est arretee la. Un workflow jamais vu rouge n'est pas un workflow prouve.
#
# LA PROTECTION DE main S'APPLIQUE A TOUT LE MONDE, PROPRIETAIRE COMPRIS. Le
# controle « Les huit controles de CONTRIBUTING » est requis, la pull request
# obligatoire, et `enforce_admins` vaut true. Un push direct sur main est refuse,
# sans exception et sans sortie de secours.
#
# CE COMMENTAIRE A AFFIRME L'INVERSE jusqu'au 10 aout 2026 : il decrivait
# `enforce_admins` a false et un push direct qui « reussit quand meme ». Le
# reglage a change le 31 juillet en LS-69 sans que ce texte suive, et il invitait
# donc a tenter un contournement qui echoue. Mesure avant correction :
#
#   gh api repos/krismos64/lune-soleil/branches/main/protection \
#     --jq .enforce_admins.enabled   # true
#
# Ne pas verifier ce reglage par un push reel sur main. Le cas s'est produit a
# l'epoque ou il valait false et a laisse le commit b550194 hors de toute pull
# request. L'appel API ci-dessus repond sans rien ecrire.
#
# UN SEUL JOB, ET NON HUIT EN PARALLELE. Les controles partagent l'installation
# des dependances, la generation du client Prisma et la base PostgreSQL. Les
# repartir sur plusieurs jobs rejouerait `npm ci` et `prisma generate` a chaque
# fois, pour un gain nul a cette taille de projet. Le decoupage se reconsiderera
# quand la duree totale genera.
#
# ORDRE VOLONTAIRE. La validation du schema passe EN PREMIER, decision de
# l'arbitrage du 29 juillet : c'est le seul controle dont l'absence d'execution a
# deja laisse passer un defaut. Le placer apres la construction retarderait son
# signal sans rien apporter.
#
# AUCUN COMPTE DE CONTROLES N'EST FIGE ICI. Le nombre d'assertions de
# verifier-schema.sh augmente a chaque story ; un chiffre attendu inscrit dans ce
# fichier deviendrait faux a la story suivante et serait relache plutot que
# corrige. Les scripts portent eux-memes leurs garde-fous de completude.
#
# PAS DE SERVICE `services:` ICI, ET C'EST DELIBERE. Les deux modes de
# verifier-schema.sh pilotent leur base par `docker exec` sur un conteneur NOMME,
# jetable pour l'un, `lune-soleil-db` pour l'autre. Un service GitHub Actions
# porte un nom engendre a l'execution, que le script ne peut pas deviner. La base
# est donc demarree par `docker run` sous le nom attendu, ce qui laisse le script
# intact : il est prouve par mutation, le modifier pour l'integration continue
# obligerait a rejouer cette preuve.
name: Controles

on:
  pull_request:
    branches: [main]
  # Egalement sur main apres fusion : une fusion en rebase rejoue les commits sur
  # une base differente de celle testee dans la pull request, le resultat n'est
  # donc pas garanti identique.
  push:
    branches: [main]

# Une nouvelle poussee sur une branche annule l'execution precedente, qui porte
# sur un code deja remplace. Jamais sur main : chaque etat fusionne doit avoir
# son propre resultat, sous peine de laisser un commit sans controle.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Lecture seule. Ce workflow ne publie rien, ne commente rien et n'ecrit dans
# aucun paquet : le jeton n'a besoin d'aucun droit d'ecriture.
permissions:
  contents: read

jobs:
  controles:
    name: Les huit controles de CONTRIBUTING
    runs-on: ubuntu-latest
    # Une execution complete tient largement dedans. Cette borne evite qu'une
    # etape bloquee, un conteneur qui ne demarre jamais, consomme une heure.
    timeout-minutes: 30

    env:
      # Base de controle, jetable, detruite avec le runner et joignable
      # uniquement depuis ce job. Ces valeurs ne protegent aucune donnee reelle
      # et ne sont un secret dans aucun sens utile.
      #
      # ECRITES EN MORCEAUX, ET NON EN UNE CHAINE DE CONNEXION. Le motif
      # `utilisateur:valeur@hote` fait bloquer le commit par l'analyse de
      # secrets, a juste titre : le depot est public, et l'analyse ne peut pas
      # deviner qu'une valeur est inventee. Un faux positif tolere apprend a
      # ignorer l'alerte, et c'est le vrai secret suivant qui passe. Meme
      # traitement que dans les tests unitaires de LS-68.
      #
      # Le port 55432 est celui de docker-compose.yml en local, garde ici pour
      # que les deux environnements se ressemblent.
      PGUSER: lunesoleil
      PGPASSWORD: ci_local_jetable
      PGDATABASE: lunesoleil
      PGPORT: "55432"
      # Playwright et Vitest lisent CI : `forbidOnly`, une retentative, et le
      # rapporteur GitHub. Le runner la definit deja, cette ligne rend la
      # dependance visible plutot qu'implicite.
      CI: "true"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      # DATABASE_URL est assemblee ici plutot qu'ecrite en clair plus haut, voir
      # le commentaire du bloc `env`. Elle est ensuite disponible pour toutes les
      # etapes suivantes, prisma.config.ts la lisant pour `migrate deploy` comme
      # pour la base ephemere des tests d'integration.
      - name: Composer l'URL de connexion
        run: |
          # Le prefixe du protocole est lui aussi assemble. Ecrit d'un seul
          # tenant, meme avec des variables a la place de l'utilisateur et du mot
          # de passe, la forme reconnue par l'analyse de secrets reste litterale
          # dans le fichier et le commit est bloque. L'analyse ne peut pas savoir
          # que ces valeurs sont jetables, et c'est le bon comportement pour un
          # depot public.
          schema='postgre'
          schema="${schema}sql://"
          printf 'DATABASE_URL=%s%s:%s@localhost:%s/%s?schema=public\n' \
            "$schema" "$PGUSER" "$PGPASSWORD" "$PGPORT" "$PGDATABASE" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Authentification, LS-70.
      #
      # LE CONTROLE 8 SERT UNE VRAIE APPLICATION. Playwright demarre
      # `next start`, qui evalue src/lib/auth.ts hors phase de construction :
      # le garde-fou y exige BETTER_AUTH_SECRET, et il a raison. Sans lui,
      # Better Auth signerait ses cookies avec un secret par defaut public.
      #
      # CE N'EST PAS UN SECRET DE COMPLAISANCE. Il ne contente pas un controle,
      # il configure un serveur reellement servi le temps de la suite. La
      # nuance est visible dans sa duree de vie : engendre a chaque execution,
      # jamais ecrit dans le depot, detruit avec le runner. Aucune session
      # signee par cette valeur n'existe ailleurs que dans ces neuf minutes.
      #
      # `openssl` plutot qu'une constante, pour la meme raison que le mot de
      # passe de la base est jetable : une valeur litterale dans un depot
      # PUBLIC serait bloquee par l'analyse de secrets, a juste titre, et un
      # faux positif tolere apprend a ignorer l'alerte suivante.
      #
      # BETTER_AUTH_URL doit designer le serveur REELLEMENT servi, port compris,
      # sinon Better Auth rejette toute connexion en « Invalid origin ». Le port
      # 3100 est celui de playwright.config.ts.
      #
      # `add-mask` est indispensable : GitHub ne masque que ce qu'il connait
      # deja, et une valeur engendree pendant l'execution lui est inconnue. Sans
      # cette ligne elle s'affiche EN CLAIR dans le bloc `env:` de chaque etape
      # suivante, sur un depot public. Sans consequence ici puisqu'elle meurt
      # avec le runner, mais une valeur en clair toleree dans un journal apprend
      # a ne plus regarder les suivantes.
      #
      # La valeur passe par une variable AVANT d'etre masquee puis ecrite :
      # appeler openssl deux fois produirait deux valeurs distinctes, et celle
      # qui serait masquee ne serait pas celle qui sert.
      - name: Composer les variables d'authentification
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          printf 'BETTER_AUTH_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
          printf 'BETTER_AUTH_URL=http://127.0.0.1:3100\n' >> "$GITHUB_ENV"

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # La version vient de .nvmrc et n'est PAS recopiee ici. Prisma 7 refuse
          # les majeures impaires de Node et `engines` est rendu bloquant par
          # engine-strict : une version ecrite en double dans ce fichier
          # divergerait de .nvmrc sans que rien ne le signale, et l'ecart
          # n'apparaitrait qu'a l'installation.
          node-version-file: .nvmrc
          cache: npm

      # ----------------------------------------------------------------------
      # Controle 1, installation des dependances avec verrouillage.
      #
      # `npm ci` et non `npm install` : il exige package-lock.json, echoue si le
      # verrou diverge de package.json, et n'ecrit jamais dans le verrou. Une
      # chaine qui met a jour ses dependances toute seule ne teste pas ce qui
      # sera deploye.
      # ----------------------------------------------------------------------
      - name: 1. Installation des dependances
        run: npm ci

      # `src/generated/prisma` n'est pas versionne : le generateur ecrit plusieurs
      # centaines de fichiers qu'aucune relecture ne couvre. Sans cette etape, la
      # verification des types, l'analyse statique et la construction echouent
      # toutes sur un import introuvable.
      - name: Engendrer le client Prisma
        run: npx prisma generate

      # ----------------------------------------------------------------------
      # Controle 6, premiere moitie : le SQL de REFERENCE dit-il ce qu'on croit ?
      #
      # PLACE EN TETE, avant l'analyse statique et la construction. Ce controle
      # porte le modele de donnees, la partie du systeme ou un defaut coute le
      # plus cher et se repare le moins bien.
      #
      # Mode conception, sans argument : le script demarre SON PROPRE conteneur
      # jetable sur le port 55414, y applique schema.sql et les deux fichiers de
      # contraintes, puis le detruit. Il ne touche pas a la base migree ci-apres.
      #
      # Il sort en code 2 quand sa preparation echoue, distinct du code 1 d'un
      # controle en echec, et n'execute alors AUCUNE assertion plutot que
      # d'afficher des reussites qui ne verifient rien. Les deux codes font
      # echouer cette etape, ce que le critere d'acceptation exige : zero
      # controle execute n'est jamais un succes.
      # ----------------------------------------------------------------------
      - name: 6. Validation du schema de reference
        run: ./prisma/sql-manuel/verifier-schema.sh

      # La base que le mode « realite » attend. Nom, role et base identiques a
      # docker-compose.yml, que l'integration continue ne peut pas employer : ce
      # fichier exige un .env, absent ici et jamais commite.
      #
      # Ni volume ni redemarrage : ce conteneur meurt avec le runner.
      - name: Demarrer la base de controle
        run: |
          docker run -d --name lune-soleil-db \
            -e POSTGRES_USER="$PGUSER" \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e POSTGRES_DB="$PGDATABASE" \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C.UTF-8" \
            -p "127.0.0.1:$PGPORT:5432" \
            postgres:18.4

          # `pg_isready` seul repond avant que la base applicative n'existe. La
          # requete confirme que POSTGRES_DB accepte les connexions, meme motif
          # que le healthcheck de docker-compose.yml.
          for _ in $(seq 1 30); do
            if docker exec lune-soleil-db \
                 psql -U "$PGUSER" -d "$PGDATABASE" -c 'SELECT 1' >/dev/null 2>&1; then
              echo "base prete"
              exit 0
            fi
            sleep 2
          done
          echo "la base n'est pas prete apres 60 secondes"
          docker logs lune-soleil-db
          exit 1

      # Le schema arrive par les migrations versionnees, jamais par le SQL de
      # reference : c'est ce qui rend le controle suivant capable de voir une
      # divergence entre schema.prisma et schema.sql.
      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      # ----------------------------------------------------------------------
      # Controle 6, seconde moitie : Prisma cree-t-il ce que le SQL de reference
      # decrit ?
      #
      # LES DEUX MODES NE SONT PAS REDONDANTS. Le premier valide l'intention, le
      # second valide ce que la production recevra reellement. Une divergence
      # entre schema.prisma et schema.sql n'est visible QUE par celui-ci : le
      # premier passerait au vert sur un SQL de reference juste et une migration
      # fausse. C'est exactement le defaut passe le 29 juillet.
      # ----------------------------------------------------------------------
      - name: 6b. Validation du schema reellement migre
        run: ./prisma/sql-manuel/verifier-schema.sh --base-migree

      # Coherence de .claude/rules/ avec le schema : purement textuel, quelques
      # secondes, aucune base requise. Il attrape les identifiants de regles
      # fantomes, trois trouves lors de son ecriture.
      - name: 6c. Regles Claude confrontees au schema
        run: ./scripts/verifier-regles.sh

      # `--strict` sort en 1 sur anomalie, mode ecrit pour cette story. Sans lui
      # le script se contente d'avertir, ce qui convient au hook `Stop` de fin de
      # session mais laisserait passer une derive ici.
      #
      # Il attrape ce qui casse aucun test : un ADR absent de la table
      # d'aiguillage, un CLAUDE.md au-dela de 200 lignes, un renvoi vers un
      # fichier inexistant, une fiche memoire hors index, un journal manquant
      # alors que du code a ete commite.
      - name: 6d. Coherence de la configuration Claude Code
        run: ./scripts/verifier-config-claude.sh --strict

      # Coherence du registre des traitements avec le schema, LS-90. Textuel lui
      # aussi, aucune base requise. Il attrape la table qui entre au schema sans
      # entrer au registre, defaut qui ne fait rougir ni type ni test, et refuse
      # qu'une table portant un champ personnel soit rangee hors traitement.
      - name: 6e. Registre des traitements confronte au schema
        run: ./scripts/verifier-registre-traitements.sh

      # Resolution de l'adresse client derriere le proxy, LS-91. Textuel, aucune
      # base ni conteneur requis.
      #
      # CE QU'IL GARDE tient en une directive Nginx, et le defaut qu'il attrape
      # est SILENCIEUX : remplacer $remote_addr par la forme repandue
      # $proxy_add_x_forwarded_for laisse le site fonctionner normalement,
      # pendant que la colonne adresse_ip du journal des connexions se vide au
      # gre des visiteurs qui envoient un en-tete non analysable. Aucun type,
      # aucun test applicatif et aucun rendu ne bougent.
      - name: 6f. Resolution de l'adresse client derriere le proxy
        run: ./scripts/verifier-nginx.sh

      # ----------------------------------------------------------------------
      # Controles 2 et 3. Le format entre ici parce qu'un depot ou seule une
      # partie des fichiers est formatee produit des diffs illisibles.
      # ----------------------------------------------------------------------
      - name: 2. Analyse statique
        run: npm run lint

      - name: 3. Verification des types
        run: npm run type-check

      - name: 3b. Format
        run: npm run format:check

      # ----------------------------------------------------------------------
      # Controle 4, tests unitaires. Sans base, rapides, ils cadrent les erreurs
      # de manipulation d'URL de connexion.
      # ----------------------------------------------------------------------
      - name: 4. Tests unitaires
        run: npm run test:unitaire

      # ----------------------------------------------------------------------
      # Controle 5, tests d'integration sur base ephemere.
      #
      # La preparation globale cree une base au nom unique sur le meme serveur,
      # y applique `migrate deploy`, et la detruit apres la suite. Elle ECHOUE
      # plutot que d'ignorer les tests si la base est injoignable : un controle
      # qui se desactive tout seul quand son environnement manque afficherait
      # « aucun echec » ici meme, et le jour ou la reservation casserait personne
      # ne le saurait.
      #
      # C'est l'etape qui porte le jalon du projet, la vente du dernier
      # exemplaire en concurrence.
      # ----------------------------------------------------------------------
      - name: 5. Tests d'integration sur base ephemere
        run: npm run test:integration

      # ----------------------------------------------------------------------
      # Controle 7, construction de l'application.
      #
      # Explicite malgre le `npm run build` que playwright.config.ts declenche :
      # un echec de construction doit se lire sur son propre pas, pas au fond du
      # journal du serveur de test. La seconde construction est servie par le
      # cache de Next.js.
      # ----------------------------------------------------------------------
      - name: 7. Construction de l'application
        run: npm run build

      # ----------------------------------------------------------------------
      # Controle 8, scenarios de bout en bout.
      #
      # Trois largeurs, 320, 390 et 1280 px, plus axe-core. Le navigateur se
      # telecharge ici, il n'est pas preinstalle sur le runner. `--with-deps`
      # ajoute les bibliotheques systeme que Chromium exige sur Ubuntu.
      #
      # Seul Chromium : ces projets verifient des LARGEURS et non des moteurs de
      # rendu, ajouter WebKit et Firefox couterait deux telechargements par
      # execution sans rien prouver de plus sur le dimensionnement.
      # ----------------------------------------------------------------------
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: 8. Scenarios critiques de bout en bout
        run: npm run test:e2e

      # ----------------------------------------------------------------------
      # Prolongement du controle 7 : l'image se construit-elle, et est-elle
      # sure ? LS-74.
      #
      # ICI ET NON DANS LE WORKFLOW DE PUBLICATION. Une image qui ne se
      # construit pas doit faire rougir la pull request, pas etre decouverte
      # apres la fusion, quand `main` est deja cassee. Ce pas ne publie rien :
      # le jeton de ce workflow reste en `contents: read`.
      #
      # LE DEFAUT QUE CE PAS RATTRAPE EST REEL. `public/` etait vide et git ne
      # suit pas les dossiers vides : la construction reussissait sur le poste
      # de developpement et echouait sur un clone neuf. Sans ce pas, personne ne
      # l'aurait vu avant la phase 6.
      # ----------------------------------------------------------------------
      - name: 7b. Construction de l'image Docker
        run: docker build -t lune-soleil:verification .

      # Le controle des couches est ce qui protege l'invariant 9 : un `.env`
      # entre dans une couche y reste meme supprime ensuite, et l'image part sur
      # un registre public. Sa preuve par mutation vit dans
      # `scripts/verifier-image-docker-mutation.sh`, hors CI, elle construit des
      # images volontairement fautives.
      - name: 7c. Controles de securite de l'image
        run: ./scripts/verifier-image-docker.sh lune-soleil:verification

      # Le rapport n'existe qu'en cas d'echec exploitable ; `if: failure()` evite
      # de televerser un dossier vide a chaque execution verte.
      - name: Rapport Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

      # ----------------------------------------------------------------------
      # Hors des huit : l'absence de vulnerabilite connue.
      #
      # CLAUDE.md exige `npm audit` a zero. Le controle est ici plutot que dans
      # un travail de veille separe parce qu'une dependance vulnerable entre par
      # une pull request, jamais autrement.
      # ----------------------------------------------------------------------
      - name: Audit des dependances
        run: npm audit --audit-level=low
