# Veilleur du controle nocturne, LS-235.
#
# POURQUOI UN WORKFLOW SEPARE, ET CE N'EST PAS UNE PREFERENCE DE STYLE.
#
# UNE ETAPE INTERNE NE PEUT PAS SIGNALER UN DEPASSEMENT DU PLAFOND DU JOB.
# Quand un job depasse son `timeout-minutes`, le runner s'arrete et toutes les
# etapes restantes sont SAUTEES, quelle que soit leur condition. `always()` ne
# s'execute pas davantage que `failure()`.
#
# MESURE QUI L'ETABLIT, execution 35509819331 du 20 septembre 2026, plafond du
# nocturne abaisse a 12 minutes pour forcer l'annulation :
#
#   20 cancelled  Scenarios critiques de bout en bout
#   26 skipped    Ouvrir une issue en cas d'echec ou d'annulation
#
# L'etape portait `if: failure() || cancelled()`. Elle n'a pas tourne, et
# l'issue 346 n'a rien recu.
#
# CE QUE CETTE MESURE A INVALIDE. La premiere correction de LS-235 se contentait
# d'elargir la condition de l'etape interne. Elle n'aurait RIEN change aux trois
# nuits muettes des 18, 19 et 20 septembre 2026 : le defaut aurait ete declare
# corrige alors qu'il restait entier. Une alerte non eprouvee sur le mode de
# defaillance qu'elle vise ne le couvre pas, motif « garde-fou jamais exerce ».
#
# CE QUI REND CELUI-CI IMMUNISE. `workflow_run` le declenche APRES la fin du
# nocturne, dans son propre job, avec son propre plafond. Le plafond du nocturne
# ne peut donc rien contre lui, et `github.event.workflow_run.conclusion` porte
# le verdict reel, `cancelled` compris.
#
# IL DOIT VIVRE SUR LA BRANCHE PAR DEFAUT. GitHub ne declenche un `workflow_run`
# que depuis la definition presente sur la branche par defaut : ce fichier ne
# garde rien tant qu'il n'est pas fusionne sur `main`, et une modification ne
# prend effet qu'apres fusion. Le verifier apres chaque changement.
name: Veilleur du controle nocturne

on:
  workflow_run:
    workflows: ["Controle nocturne"]
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  signaler:
    name: Signaler un nocturne qui n'a pas abouti
    runs-on: ubuntu-latest
    # UN NOCTURNE VERT NE DOIT RIEN COUTER. Ce job ne demarre que sur un verdict
    # qui demande une lecture humaine.
    if: github.event.workflow_run.conclusion != 'success'
    timeout-minutes: 5

    steps:
      - name: Ouvrir ou commenter l'issue de veille
        env:
          GH_TOKEN: ${{ github.token }}
          # `GH_REPO` EST OBLIGATOIRE ICI, et son absence a fait echouer la
          # premiere version, execution 35512451076 du 20 septembre 2026 :
          #
          #   failed to run git: fatal: not a git repository
          #
          # `gh` deduit le depot du repertoire git courant. Ce job ne fait aucun
          # `checkout`, n'ayant rien a lire dans le depot pour ecrire une issue :
          # il n'y a donc PAS de repertoire git, et les trois commandes `gh`
          # echouent avant d'avoir rien tente. Le declenchement etait bon, les
          # variables aussi, `VERDICT` valait bien `cancelled`.
          #
          # Ajouter un `checkout` marcherait et couterait une copie du depot
          # pour rien. Nommer le depot est plus direct et dit ce qui manquait.
          GH_REPO: ${{ github.repository }}
          # Ces valeurs viennent d'un evenement GitHub et sont passees par
          # `env`, jamais interpolees dans le corps du script : une expression
          # `${{ }}` ecrite au milieu d'un `run` serait remplacee AVANT que bash
          # ne la voie, ce qui est la forme classique de l'injection de commande
          # dans un workflow.
          VERDICT: ${{ github.event.workflow_run.conclusion }}
          LIEN: ${{ github.event.workflow_run.html_url }}
          NUMERO: ${{ github.event.workflow_run.run_number }}
        run: |
          # L'ETIQUETTE SE CREE AVANT D'ETRE POSEE, LS-199.
          #
          # `gh issue create --label` echoue si l'etiquette n'existe pas, et
          # l'etape entiere tombe avec elle : c'est ce qui avait rendu le
          # garde-fou muet deux nuits. Une etiquette vit dans les REGLAGES du
          # depot et non dans le depot, donc la creer a la main ne survit ni a
          # un clone ni a un depot recree. `--force` rend l'instruction
          # idempotente.
          gh label create controle-nocturne \
            --description "Echec ou annulation du controle nocturne, LS-177" \
            --color B60205 --force

          # UNE SEULE ISSUE OUVERTE A LA FOIS, sans quoi une semaine de rouges
          # produirait sept issues identiques, et le bruit ferait ignorer la
          # premiere.
          existante=$(gh issue list --state open --label controle-nocturne \
            --json number --jq '.[0].number' 2>/dev/null || true)

          # DEUX DIAGNOSTICS OPPOSES, DONC DEUX CORPS.
          #
          # Un echec dit qu'un controle a rendu un verdict rouge. Une annulation
          # dit que des controles NE SE SONT PAS PRONONCES DU TOUT, ce qui ne se
          # soigne pas de la meme facon : chercher un defaut dans le code apres
          # un depassement de plafond, c'est chercher ce qui n'y est pas.
          if [ "$VERDICT" = "cancelled" ]; then
            titre="Controle nocturne annule avant son terme"
            corps=$(printf 'Le controle nocturne numero %s a ete ANNULE, il n a pas echoue.\n\nLa cause la plus probable est le depassement du `timeout-minutes` du job. Le temps d attente avant que le runner ne prenne le job compte dans ce plafond : un job peut donc etre annule au dela de la duree cumulee de ses etapes.\n\nJournal complet : %s\n\nCE QUI COMPTE ICI EST CE QUI N A PAS TOURNE. Les etapes placees apres celle qui a consomme le plafond ont ete SAUTEES, quelle que soit leur condition. Leur silence ne vaut pas un vert : aucune ne s est prononcee.\n\nLe geste : ouvrir le journal, reperer l etape sans heure de fin, et comparer sa duree a sa borne locale. Une etape sans borne locale consomme tout ce qui reste du plafond du job, motif de LS-106, LS-124 et LS-235.\n\nUne annulation manuelle produit aussi cette issue, et se referme alors d un geste.\n' "$NUMERO" "$LIEN")
          else
            titre="Controle nocturne en echec"
            corps=$(printf 'Le controle nocturne numero %s a echoue, verdict `%s`.\n\nCes controles ne tournent plus sur les pull requests depuis LS-177 : les scenarios de bout en bout, `npm audit` et la construction de l image. Un echec ici signifie qu un defaut est entre sur `main`, pas qu une fusion est a bloquer.\n\nJournal complet : %s\n\nCe qui a pu echouer :\n\n- un defaut d interface, debordement, lien mort, etat non nominal\n- une vulnerabilite publiee depuis hier, `npm audit`\n- une image qui ne se construit plus\n- une preuve par mutation qui ne detecte plus son defaut\n\nLe jalon metier, lui, est verifie a chaque pull request : il vit dans les tests d integration.\n' "$NUMERO" "$VERDICT" "$LIEN")
          fi

          if [ -n "$existante" ]; then
            gh issue comment "$existante" --body "$corps"
            echo "Commentaire ajoute a l issue #$existante."
          else
            gh issue create --title "$titre" --body "$corps" \
              --label controle-nocturne
          fi
