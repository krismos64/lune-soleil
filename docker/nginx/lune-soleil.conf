# Configuration Nginx de la boutique, a installer SUR L'HOTE. LS-91.
#
# CE FICHIER PORTE LA CORRECTION DE LS-91, et non `src/lib/auth.ts`. Le ticket
# supposait que declarer un proxy de confiance dans Better Auth suffirait a ce
# que l'adresse IP cesse d'etre nulle. La mesure a montre autre chose, et c'est
# ici que la decision se prend.
#
# CE QU'IL N'EST PAS : un fichier lu par Docker Compose. Nginx tourne sur
# l'hote, hors conteneur, et ce fichier se copie dans
# /etc/nginx/sites-available/ puis se lie dans sites-enabled/. Il est versionne
# pour que la valeur ne soit pas inventee sur le serveur, au meme titre que
# `docker/cron/crontab` l'est pour les taches planifiees.
#
# TLS, HSTS ET REDIRECTION 80 -> 443 SONT AJOUTES PAR LS-151, phase 6, comme
# l'annoncait la version de LS-91 qui ne portait que le bloc 443.
#
# LA MACHINE N'EST PAS VIERGE, ADR-036. Elle sert deja SmartPlanning, et Nginx
# y tourne avec deux sites actifs. Ce fichier s'ajoute a cote d'eux, il ne
# remplace aucune configuration existante et n'en modifie aucune.
#
# CE FICHIER NE DECLARE AUCUNE ZONE `limit_req_zone` NI `limit_conn_zone`, et
# c'est deliberé. Ces directives vivent dans le contexte `http` GLOBAL meme
# quand elles sont ecrites dans un fichier de site : SmartPlanning declare deja
# `general`, `auth`, `api` et `conn_limit`. Reutiliser un de ces noms ferait
# echouer `nginx -t` avec « duplicate zone », et le rechargement casserait LES
# DEUX SITES. Si une limitation de debit devient necessaire ici, ses zones
# devront porter un prefixe `ls_`.
#
# `listen ... ssl http2` ET NON la directive `http2 on;` : celle-ci n'existe
# qu'a partir de Nginx 1.25, et cette machine sert Nginx 1.24.0. Mesure le
# 8 septembre 2026, `nginx -t` rend « unknown directive "http2" » et echoue,
# donc plus aucun rechargement n'est possible pour AUCUN site de la machine.
#
# INSTALLATION, dans cet ordre :
#   1. copier dans /etc/nginx/sites-available/lune-soleil.conf
#   2. `sudo nginx -t`   AVANT tout lien et tout rechargement
#   3. lier dans sites-enabled/, `nginx -t` de nouveau, puis `systemctl reload`
# Un `reload` sur une configuration invalide n'applique rien, mais un `restart`
# sur la meme configuration ARRETE Nginx, donc les deux autres sites avec.

# ----------------------------------------------------------------------------
# HTTP, redirection vers HTTPS.
#
# Le bloc laisse passer `/.well-known/acme-challenge/` EN CLAIR : c'est par la
# que Let's Encrypt valide le domaine, et le rediriger en 301 ferait echouer le
# renouvellement automatique. Le certificat expirerait alors silencieusement
# quatre-vingt-dix jours plus tard.
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name lune-soleil.fr www.lune-soleil.fr;

    # LE CHALLENGE ACME EST RELAYE, JAMAIS SERVI DEPUIS LE DISQUE.
    #
    # `root` et `alias` sont INTERDITS dans ce fichier, et le controle
    # `verifier-nginx.sh` les refuse : Nginx qui sert des fichiers rendrait une
    # facture atteignable sans jeton, LS-132 critere 6. La regle a rougi sur une
    # premiere version de ce bloc, le 8 septembre 2026, et elle avait raison.
    #
    # Le challenge passe donc par certbot en mode `--standalone`, qui ecoute le
    # temps du renouvellement sur 127.0.0.1:8888. Aucun repertoire n'est expose,
    # et l'invariant de LS-132 tient sans exception ni derogation.
    #
    # Ce bloc doit rester EN CLAIR, hors de la redirection vers HTTPS : le
    # rediriger ferait echouer la validation, et le certificat expirerait en
    # silence quatre-vingt-dix jours plus tard.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://lune-soleil.fr$request_uri;
    }
}

# ----------------------------------------------------------------------------
# HTTPS sur www, redirection vers le domaine nu.
#
# Un bloc distinct et non un `server_name` commun : la redirection doit se faire
# APRES la poignee de main TLS, sinon le navigateur affiche un avertissement de
# certificat avant de suivre la redirection. Le certificat couvre les deux noms.
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.lune-soleil.fr;

    ssl_certificate     /etc/letsencrypt/live/lune-soleil.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lune-soleil.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://lune-soleil.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name lune-soleil.fr;

    ssl_certificate     /etc/letsencrypt/live/lune-soleil.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lune-soleil.fr/privkey.pem;

    # `ssl_protocols` EST REDECLARE ICI, ET CE N'EST PAS REDONDANT.
    #
    # Le `nginx.conf` de cette machine porte `ssl_protocols TLSv1 TLSv1.1
    # TLSv1.2 TLSv1.3`, mesure le 8 septembre 2026. TLSv1 et TLSv1.1 sont
    # obsoletes depuis 2021, RFC 8996. Sans cette ligne, la boutique en
    # HERITERAIT en silence, et un paiement voyagerait sur un protocole retire.
    # SmartPlanning fait la meme surcharge dans son propre fichier.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_LS:10m;
    ssl_session_timeout 1d;

    # PAS DE `ssl_stapling`, et c'est mesure et non suppose. Let's Encrypt a
    # retire l'URL OCSP de ses certificats : la directive est alors ignoree et
    # Nginx emet « no OCSP responder URL in the certificate » a chaque test de
    # configuration. Elle est presente chez SmartPlanning et produit exactement
    # cet avertissement, releve le 8 septembre 2026.

    # HSTS. Le navigateur refusera le HTTP en clair pendant deux ans.
    #
    # `always` EST INDISPENSABLE : sans lui, `add_header` ne pose l'en-tete que
    # sur les reponses 2xx, 204, 301, 302 et 304. Une page d'erreur 500 partirait
    # donc sans HSTS, ce qui est exactement le moment ou un client attaque a
    # besoin de la protection.
    #
    # PAS DE `preload` : l'inscription sur la liste des navigateurs est
    # difficilement reversible, et elle engagerait tous les sous-domaines. Ce
    # choix se prend a LS-139, avec le reste du durcissement.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ------------------------------------------------------------------
    # LES TROIS AUTRES EN-TETES, ADR-038, LS-139.
    #
    # LA CSP N'EST PAS ICI, elle vient de l'application : elle porte un NONCE
    # par requete, que seul le rendu peut engendrer. Nginx ne peut pas la poser
    # sans devenir statique, donc sans valeur.
    #
    # CEUX-CI SONT CHEZ NGINX PARCE QU'ILS NE DEPENDENT D'AUCUNE REQUETE, et
    # surtout parce que Nginx les sert MEME QUAND L'APPLICATION EST TOMBEE. Une
    # page 502 partirait sinon sans `nosniff`, c'est-a-dire au moment ou le
    # client est le plus expose.
    #
    # `always` SUR LES TROIS, meme raison que HSTS deux lignes plus haut : sans
    # lui l'en-tete ne part que sur une partie des codes de reponse.
    # ------------------------------------------------------------------

    # Le navigateur respecte le `content-type` annonce au lieu de le deviner.
    # Sans lui, un fichier televerse par l'administration et servi en
    # `text/plain` peut etre INTERPRETE comme du HTML, donc executer du script.
    add_header X-Content-Type-Options "nosniff" always;

    # L'adresse complete ne fuit pas vers un autre site. `strict-origin-...`
    # envoie l'origine seule en navigation externe, et rien du tout en
    # retrogradant vers HTTP : une URL de retractation porte un JETON, et il n'a
    # aucune raison de partir dans le `Referer` d'un site tiers.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les trois interfaces que le navigateur peut ouvrir sans le dire. La
    # boutique n'en utilise AUCUNE : les refuser explicitement empeche qu'un
    # script injecte les demande, et retire la question a l'utilisateur.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Les medias sont un volume local, ADR-007, servi par l'application.
    # Le plafond borne un televersement de photographie depuis l'administration.
    #
    # 26M, ET CETTE VALEUR SE RECOPIE DE `next.config.ts`, LS-207. Elle ne se
    # choisit pas ici : c'est `bodySizeLimit` qui la fixe, et son commentaire
    # explique pourquoi 26 et non 25.
    #
    # TROIS PLAFONDS SONT EN JEU, et ils doivent decroitre dans le bon ordre :
    #   25 Mo   TAILLE_MAX_OCTETS, le fichier lui-meme, media-validation.ts
    #   26 Mo   bodySizeLimit, le corps transporte, qui ajoute environ 175
    #           octets d'encodage multipart au fichier
    #   26 Mo   ici, le transport
    #
    # LE DEFAUT QU'ON FERME. Ce plafond valait 12M, ecrit en LS-91 avant que
    # celui du service soit fixe a 25 Mo. Une photographie de 17 Mo, cas
    # eprouve par ADR-007, recevait donc un 413 de Nginx AVANT que la Server
    # Action ne s'execute : `FichierTropVolumineuxError` n'etait jamais
    # atteint, le message « 25 Mo au maximum » jamais affiche, et l'ecran
    # restait sur sa progression.
    #
    # C'EST EXACTEMENT LE DEFAUT QUE `next.config.ts` DECRIT et qu'il a corrige
    # a son niveau, reproduit un cran plus haut dans la chaine. Son commentaire
    # designe d'ailleurs cette directive comme la borne de production, sans que
    # personne verifie qu'elle etait coherente.
    #
    # LA MARGE N'AUTORISE AUCUN FICHIER PLUS GROS : elle laisse le refus se
    # produire dans le service, qui sait le nommer. Un 413 nu ne dit rien a
    # l'exploitante. `verifier-plafonds-corps.sh` confronte les trois valeurs et
    # rougit si elles divergent.
    client_max_body_size 26M;

    # ------------------------------------------------------------------------
    # LES MEDIAS, SERVIS DEPUIS LE VOLUME. ADR-007, LS-205.
    #
    # POURQUOI NGINX ET NON UN GESTIONNAIRE DE ROUTE NEXT. ADR-007 tranche et
    # ecarte nommement la seconde voie : chaque image reveillerait le processus
    # Node, imposerait d'ecrire le cache a la main, et ouvrirait une surface de
    # traversee de chemin a garder soi-meme. Nginx sert un fichier statique,
    # c'est son travail, et c'est le chemin le plus chaud du site.
    #
    # CE BLOC EST LA SEULE DIRECTIVE `alias` AUTORISEE DE CE FICHIER, et
    # `verifier-nginx.sh` le verifie par son CHEMIN et non par la directive :
    # tout `alias` qui ne vise pas exactement `medias/public/` est refuse. Le
    # controle refusait auparavant toute directive de service de fichiers, ce
    # qui rendait ADR-007 inapplicable et laissait le catalogue sans images,
    # LS-205. C'est le CHEMIN qui porte le risque, pas la directive.
    #
    # `public/` ET JAMAIS LA RACINE DU VOLUME. La racine porte DEUX dossiers,
    # `quarantaine/` et `public/`. La quarantaine contient les ORIGINAUX non
    # traites, qui portent les metadonnees EXIF et la position GPS du domicile
    # de l'exploitante : c'est exactement la donnee qu'ADR-007 existe pour
    # retirer. Un alias sur la racine la publierait et annulerait la decision.
    #
    # LA RACINE DES DOCUMENTS RESTE HORS D'ATTEINTE. `DOCUMENTS_RACINE` est une
    # arborescence DISTINCTE, jamais servie : une facture passe par un jeton
    # signe verifie cote serveur, invariant 2 et LS-132 critere 6. Aucun chemin
    # de ce fichier ne doit permettre d'y descendre, ce que le controle verifie.
    #
    # LE `/` FINAL DE L'ALIAS EST OBLIGATOIRE. Sans lui, `/medias../` sortirait
    # du dossier vise. Nginx normalise deja les `..` de l'URI, mais la forme
    # correcte se pose plutot que de reposer sur cette normalisation.
    #
    # `^~` COUPE LA RECHERCHE : ce prefixe l'emporte sur toute expression
    # reguliere ajoutee plus tard dans ce fichier, donc aucun bloc futur ne peut
    # reprendre ces URL par megarde.
    location ^~ /medias/ {
        alias /var/lib/lune-soleil/medias/public/;

        # UN FICHIER ABSENT REND 404 ET NE REVEILLE PAS L'APPLICATION. Sans
        # cette ligne, la configuration par defaut suffirait, mais l'ecrire
        # empeche qu'un `try_files ... @app` soit ajoute un jour et transforme
        # chaque image manquante en requete applicative.
        try_files $uri =404;

        # LES NOMS SONT DERIVES D'UN IDENTIFIANT, donc un fichier ne change
        # jamais de contenu sous la meme URL : il est remplace par un autre nom.
        # Un an de cache est donc sur, et `immutable` evite meme la requete de
        # revalidation.
        #
        # UN SEUL `Cache-Control`, ECRIT EN ENTIER. La forme `expires 1y;` plus
        # un `add_header Cache-Control` posait DEUX en-tetes du meme nom, mesure
        # sur la production le 9 septembre 2026 : `max-age=31536000` venu
        # d'`expires`, puis `public, immutable`. Les navigateurs retiennent le
        # premier, donc `immutable` etait ignore, et un intermediaire peut
        # trancher autrement. Deux en-tetes qui se contredisent a moitie sont
        # pires qu'un seul, et aucune page ne le montre.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # AUCUN INDEX DE DOSSIER. Sans cette ligne, une requete sur un
        # repertoire pourrait en lister le contenu selon la configuration
        # globale, ce qui revelerait les identifiants de tous les medias.
        autoindex off;

        # Les en-tetes de securite du bloc serveur ne descendent PAS dans un
        # `location` qui pose ses propres `add_header` : nginx remplace le jeu
        # herite des qu'un seul est declare ici. HSTS est donc repose, sans quoi
        # les reponses de ce bloc partiraient sans lui.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # LES DEUX AJOUTES PAR ADR-038 SE REPOSENT ICI POUR LA MEME RAISON que
        # les deux ci-dessus : le commentaire du bloc l'explique, nginx remplace
        # le jeu herite des qu'un `add_header` est declare dans un `location`.
        # Les oublier laisserait les MEDIAS sans protection, alors que ce sont
        # justement des fichiers televerses.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        # L'application dans son conteneur, port publie sur la boucle locale.
        #
        # LE PORT EST 3002 ET NON 3000, ADR-036. La machine heberge aussi
        # SmartPlanning, qui occupe le 3000, et son Umami, qui occupe le 3001.
        # Cette valeur se lit ici et ne se reinvente pas sur le serveur.
        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;

        # ------------------------------------------------------------------
        # LA LIGNE QUI PORTE LS-91.
        #
        # `$remote_addr` ET NON `$proxy_add_x_forwarded_for`, et ce n'est pas
        # une preference de style : les deux se comportent differemment devant
        # un client hostile.
        #
        # `$proxy_add_x_forwarded_for` CONCATENE : il reprend l'en-tete envoye
        # par le client et lui ajoute l'adresse reelle a droite. Le client
        # choisit donc le contenu de la partie gauche de la chaine.
        #
        # Better Auth parcourt la chaine de DROITE a GAUCHE et ne retient que
        # le premier saut non fiable, ce qui empeche effectivement de FORGER
        # une adresse. Mais un autre chemin reste ouvert, et il est pire :
        #
        #   X-Forwarded-For: pasuneip, 203.0.113.7   ->  null
        #
        # Mesure sur la version installee. `getIPFromHeader` sort en `null` des
        # qu'un jeton de la chaine n'est pas analysable. Un client qui envoie un
        # en-tete bidon obtient donc une adresse NULLE dans le journal des
        # connexions : il CHOISIT DE NE PAS ETRE JOURNALISE, ce qui est
        # exactement le trou que cette story existe pour fermer, et ADR-027
        # comptant par adresse IP, il brouille aussi la limitation de debit.
        #
        # `$remote_addr` ECRASE l'en-tete recu par l'adresse de la connexion
        # TCP. Le client n'a plus aucune prise dessus, la chaine ne porte qu'un
        # seul saut, et Better Auth la resout SANS avoir besoin du moindre proxy
        # de confiance :
        #
        #   X-Forwarded-For: 203.0.113.7             ->  203.0.113.7
        #
        # CELA N'EST CORRECT QUE PARCE QUE NGINX EST LE SEUL POINT D'ENTREE.
        # Sans CDN ni equilibreur devant lui, `$remote_addr` EST deja l'adresse
        # publique reelle du client. Le jour ou un intermediaire s'ajoute, cette
        # ligne devient fausse : il faudra alors revenir a la concatenation ET
        # renseigner BETTER_AUTH_TRUSTED_PROXIES avec l'adresse de cet
        # intermediaire, les deux ensemble.
        # ------------------------------------------------------------------
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket et rechargement a chaud de Next.js.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LA ROUTE INTERNE DES TACHES PLANIFIEES N'EST PAS EXPOSEE.
    #
    # Elle est protegee par un secret partage, invariant 2, et c'est le secret
    # qui protege, pas ce bloc. Mais rien ne justifie qu'elle soit joignable
    # depuis l'exterieur : le conteneur cron l'appelle par le reseau Docker,
    # sans passer par Nginx. Refuser ici retire une surface sans rien couter.
    location /api/interne/ {
        deny all;
    }
}
