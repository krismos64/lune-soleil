# Configuration Nginx de la boutique, a installer SUR L'HOTE. LS-91.
#
# CE FICHIER PORTE LA CORRECTION DE LS-91, et non `src/lib/auth.ts`. Le ticket
# supposait que declarer un proxy de confiance dans Better Auth suffirait a ce
# que l'adresse IP cesse d'etre nulle. La mesure a montre autre chose, et c'est
# ici que la decision se prend.
#
# CE QU'IL N'EST PAS : un fichier lu par Docker Compose. Nginx tourne sur
# l'hote, hors conteneur, et ce fichier se copie dans
# /etc/nginx/sites-available/ puis se lie dans sites-enabled/. Il est versionne
# pour que la valeur ne soit pas inventee sur le serveur, au meme titre que
# `docker/cron/crontab` l'est pour les taches planifiees.
#
# TLS, HSTS et redirection 80 -> 443 appartiennent au deploiement de la phase 6
# et ne figurent pas ici : ce fichier ne porte que ce que LS-91 decide.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name lune-soleil.fr www.lune-soleil.fr;

    # Les certificats sont poses par certbot au deploiement, phase 6.
    # ssl_certificate     /etc/letsencrypt/live/lune-soleil.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lune-soleil.fr/privkey.pem;

    location / {
        # L'application dans son conteneur, port publie sur la boucle locale.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        # ------------------------------------------------------------------
        # LA LIGNE QUI PORTE LS-91.
        #
        # `$remote_addr` ET NON `$proxy_add_x_forwarded_for`, et ce n'est pas
        # une preference de style : les deux se comportent differemment devant
        # un client hostile.
        #
        # `$proxy_add_x_forwarded_for` CONCATENE : il reprend l'en-tete envoye
        # par le client et lui ajoute l'adresse reelle a droite. Le client
        # choisit donc le contenu de la partie gauche de la chaine.
        #
        # Better Auth parcourt la chaine de DROITE a GAUCHE et ne retient que
        # le premier saut non fiable, ce qui empeche effectivement de FORGER
        # une adresse. Mais un autre chemin reste ouvert, et il est pire :
        #
        #   X-Forwarded-For: pasuneip, 203.0.113.7   ->  null
        #
        # Mesure sur la version installee. `getIPFromHeader` sort en `null` des
        # qu'un jeton de la chaine n'est pas analysable. Un client qui envoie un
        # en-tete bidon obtient donc une adresse NULLE dans le journal des
        # connexions : il CHOISIT DE NE PAS ETRE JOURNALISE, ce qui est
        # exactement le trou que cette story existe pour fermer, et ADR-027
        # comptant par adresse IP, il brouille aussi la limitation de debit.
        #
        # `$remote_addr` ECRASE l'en-tete recu par l'adresse de la connexion
        # TCP. Le client n'a plus aucune prise dessus, la chaine ne porte qu'un
        # seul saut, et Better Auth la resout SANS avoir besoin du moindre proxy
        # de confiance :
        #
        #   X-Forwarded-For: 203.0.113.7             ->  203.0.113.7
        #
        # CELA N'EST CORRECT QUE PARCE QUE NGINX EST LE SEUL POINT D'ENTREE.
        # Sans CDN ni equilibreur devant lui, `$remote_addr` EST deja l'adresse
        # publique reelle du client. Le jour ou un intermediaire s'ajoute, cette
        # ligne devient fausse : il faudra alors revenir a la concatenation ET
        # renseigner BETTER_AUTH_TRUSTED_PROXIES avec l'adresse de cet
        # intermediaire, les deux ensemble.
        # ------------------------------------------------------------------
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket et rechargement a chaud de Next.js.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LA ROUTE INTERNE DES TACHES PLANIFIEES N'EST PAS EXPOSEE.
    #
    # Elle est protegee par un secret partage, invariant 2, et c'est le secret
    # qui protege, pas ce bloc. Mais rien ne justifie qu'elle soit joignable
    # depuis l'exterieur : le conteneur cron l'appelle par le reseau Docker,
    # sans passer par Nginx. Refuser ici retire une surface sans rien couter.
    location /api/interne/ {
        deny all;
    }
}
